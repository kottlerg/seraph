# Cargo workspace configuration.

[alias]
# `cargo xtask <command>` runs the xtask build runner.
xtask = "run --package xtask --"

# build-std flags are passed explicitly by `cargo xtask build` rather than
# here, to avoid applying them to host-target builds (e.g. cargo test).

# Enable JSON target spec files and set the directory rustc searches for custom
# target specs by triple name (e.g. --target x86_64-seraph-none resolves to
# targets/x86_64-seraph-none.json). json-target-spec is benign on host
# builds — it enables parsing, not forces it.
[unstable]
json-target-spec = true

[env]
RUST_TARGET_PATH = { value = "xtask/targets", relative = true }

# Bootloader flags are set by `cargo xtask` (`RUSTFLAGS`) and
# core/boot/build.rs, not here; see docs/build-system.md § Custom Targets.
# The riscv64 kernel build also runs with `RUSTFLAGS`, which replaces this
# array: a flag added here must also be added to `RISCV64_KERNEL_RUSTFLAGS`
# in xtask/src/commands/build.rs to reach the riscv64 kernel.
[build]
rustflags = ["-Zunstable-options"]
