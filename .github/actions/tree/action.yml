# .github/actions/tree/action.yml

# The composite action that carries a build job's tree to the cells that
# boot it; its `description` below states what it does.

name: Build tree
description: >-
  The tree one build job of build-test.yml built, carried to the cells
  that boot it within the same run: the sysroot, the symbols, the trust
  store, the xtask binary and the job's signing identity, and, for the
  usertest cell, the bootloader's build state its signing and rollback
  cases compile from. `ship` packs and uploads them as artifacts; `fetch`
  downloads and unpacks them, puts the xtask binary on the PATH, names the
  signing identity, and dates the checkout's tracked files before the
  shipped build. The mechanism is specified in docs/build-system.md
  § Continuous Integration.

inputs:
  mode:
    description: >-
      `ship` after the build job's build; `fetch` in a cell, before its
      first xtask command.
    required: true
  name:
    description: >-
      The artifact's name, unique in the run: `tree-<arch>-<profile>` for a
      tree, `tree-<arch>-bench` for a benchmark image.
    required: true
  arch:
    description: The tree's architecture, `x86_64` or `riscv64`.
    required: true
  boot:
    description: >-
      `true` to carry the bootloader's build state as well, as the
      artifact `<name>-boot`.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check the inputs
      if: >-
        !contains(fromJSON('["ship", "fetch"]'), inputs.mode)
        || !contains(fromJSON('["x86_64", "riscv64"]'), inputs.arch)
        || !contains(fromJSON('["true", "false"]'), inputs.boot)
      shell: sh
      env:
        MODE: ${{ inputs.mode }}
        ARCH: ${{ inputs.arch }}
        BOOT: ${{ inputs.boot }}
      run: |
        echo "::error::usage: mode ship | fetch, arch x86_64 | riscv64, boot true | false; got mode '$MODE', arch '$ARCH', boot '$BOOT'"
        exit 2

    # Each archive is a zstd tar, which keeps the modification times and
    # modes an artifact's zip would lose: Cargo judges the bootloader's
    # build state fresh by its times, and the identity's secret is readable
    # by its owner alone (docs/signing.md § Signing). The identity is the
    # job's, generated by its first build under `SERAPH_SIGNING_DIR`, outside
    # the checkout, and goes in an archive of its own, unpacked there.
    - name: Pack the tree
      if: inputs.mode == 'ship'
      shell: sh
      env:
        NAME: ${{ inputs.name }}
        ARCH: ${{ inputs.arch }}
        BOOT: ${{ inputs.boot }}
      run: |
        set -eu
        : "${SERAPH_SIGNING_DIR:?}"
        out="$RUNNER_TEMP/ship/$NAME"
        rm -rf "$out" "$out-boot"
        mkdir -p "$out"
        tar --zstd -cf "$out/tree.tar.zst" \
            sysroot symbols target/xtask/signing target/debug/xtask
        tar --zstd -cf "$out/signing.tar.zst" \
            -C "$(dirname "$SERAPH_SIGNING_DIR")" "$(basename "$SERAPH_SIGNING_DIR")"
        if [ "$BOOT" = true ]; then
            # The bootloader's target directory and the host build scripts'
            # directories, as a lane of the cell copies them
            # (`LANE_STATE`, xtask/src/commands/test/lanes.rs).
            case "$ARCH" in
                x86_64) triple=x86_64-unknown-uefi ;;
                riscv64) triple=riscv64imac-seraph-uefi ;;
            esac
            dirs="target/$triple"
            for dir in target/debug/build target/release/build; do
                if [ -d "$dir" ]; then dirs="$dirs $dir"; fi
            done
            mkdir -p "$out-boot"
            tar --zstd -cf "$out-boot/boot.tar.zst" $dirs
        fi
        du -h "$out"/* "$out-boot"/* 2>/dev/null || true

    # Kept a few days, so a cell re-run after its build job finds the tree;
    # `overwrite` lets a re-run of the build job replace it.
    - name: Upload the tree
      if: inputs.mode == 'ship'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/ship/${{ inputs.name }}
        if-no-files-found: error
        compression-level: 0
        retention-days: 3
        overwrite: true

    - name: Upload the bootloader's build state
      if: inputs.mode == 'ship' && inputs.boot == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}-boot
        path: ${{ runner.temp }}/ship/${{ inputs.name }}-boot
        if-no-files-found: error
        compression-level: 0
        retention-days: 3
        overwrite: true

    - name: Download the tree
      if: inputs.mode == 'fetch'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/fetch/${{ inputs.name }}

    - name: Download the bootloader's build state
      if: inputs.mode == 'fetch' && inputs.boot == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-boot
        path: ${{ runner.temp }}/fetch/${{ inputs.name }}

    # Cargo judges the shipped units by the checksums of the files they were
    # built from (.cargo/config.toml), so the checkout's own times make none
    # stale. The library build scripts (compiler_builtins') name toolchain
    # sources Cargo judges by time, which the cell's install sets later than
    # the build: dated as the build job dated them (.github/actions/carry),
    # a compile from the shipped bootloader state rebuilds only what the
    # case changes (a trust store). The toolchain's version is in every
    # unit's fingerprint, so the date hides no change.
    - name: Unpack the tree
      if: inputs.mode == 'fetch'
      shell: sh
      env:
        NAME: ${{ inputs.name }}
      run: |
        set -eu
        in="$RUNNER_TEMP/fetch/$NAME"
        tar --zstd -xf "$in/tree.tar.zst"
        tar --zstd -xf "$in/signing.tar.zst" -C "$RUNNER_TEMP"
        if [ -f "$in/boot.tar.zst" ]; then
            tar --zstd -xf "$in/boot.tar.zst"
            library="$(rustc --print sysroot)/lib/rustlib/src/rust/library"
            test -d "$library"
            find "$library" -exec touch -h -d 2000-01-01T00:00:00Z {} +
        fi
        rm -rf "$in"
        echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
        echo "SERAPH_SIGNING_DIR=$RUNNER_TEMP/seraph-signing" >> "$GITHUB_ENV"
