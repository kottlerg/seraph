# .github/workflows/build-test.yml

# The canonical CI tier: host tests on every push and pull request, and the
# architecture x profile x harness boots and the benchmark cell the change
# owes, which the select job computes (docs/build-system.md § Continuous
# Integration; docs/testing.md § Coverage tiers). The summary job is the one
# check branch protection requires.

name: build-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      kani-since:
        description: >-
          The commit the kani jobs select the affected proof crates from;
          empty proves every crate
        required: false
        default: ''
      kani-prove-all:
        description: >-
          Prove every job the kani plan selects, stored passes or not
        type: boolean
        required: false
        default: false
      cells-since:
        description: >-
          The commit the select job computes the owed cells from; empty
          owes every cell
        required: false
        default: ''

# A pull request's newer push cancels its older run. Every other run (each
# push to master, each merge commit among them) is grouped by its commit, so
# no later run cancels or replaces it: each merge commit gets its own run
# (docs/conventions.md § CI Gating).
concurrency:
  group: build-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  select:
    # The cells the change owes (`cargo xtask cells`, xtask/README.md): its
    # base is the newest commit of the first-parent history before this one
    # whose build-test run on a push to master passed, or on a pull request
    # passed or has not finished below no red or cancelled run, so a cell a
    # red or cancelled master run left unproven stays owed and one a master
    # run is proving is left to it; a dispatch selects from its input, or owes every cell. Reading the
    # runs needs `actions: read`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      validate: ${{ steps.cells.outputs.validate }}
      validate-owed: ${{ steps.cells.outputs.validate-owed }}
      build: ${{ steps.cells.outputs.build }}
      build-owed: ${{ steps.cells.outputs.build-owed }}
      bench: ${{ steps.cells.outputs.bench }}
      bench-owed: ${{ steps.cells.outputs.bench-owed }}
      ktest-bench: ${{ steps.cells.outputs.ktest-bench }}
      fuzz-owed: ${{ steps.cells.outputs.fuzz-owed }}
      base: ${{ steps.cells.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The base is found in, and diffed against, the history, which a
          # depth of 1 leaves out.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: select

      - name: Select the owed cells
        id: cells
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED: ${{ inputs.cells-since }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            pull_request) base=(--since-covered HEAD^1) ;;
            push) base=(--since-green HEAD^1) ;;
            *) if [ -n "$DISPATCHED" ]; then base=(--since "$DISPATCHED"); else base=(); fi ;;
          esac
          cargo xtask cells "${base[@]}" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/cells.log"
          sed -n 's/^WARNING: /::warning title=cells::/p' "$RUNNER_TEMP/cells.log"
          { echo '```'; cat "$RUNNER_TEMP/cells.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  host-tests:
    runs-on: ubuntu-latest
    # `actions: write` lets a push to master delete the job's superseded
    # build-carry entries (.github/actions/carry).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          # commit-check reads the pull request's commits back to the base
          # branch; the default depth of 1 holds only the merge commit.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Restore the build output
        # Master's latest build of the tests; see docs/build-system.md
        # § Continuous Integration.
        uses: ./.github/actions/carry
        with:
          mode: restore
          name: host-tests

      - name: cargo xtask lint-docs
        run: cargo xtask lint-docs

      - name: cargo xtask commit-check
        if: github.event_name == 'pull_request'
        run: >-
          cargo xtask commit-check
          --base origin/${{ github.base_ref }}
          --head ${{ github.event.pull_request.head.sha }}

      # `cargo xtask test` also runs the tests built for riscv64 under QEMU's
      # user-mode emulator, linked by the riscv64 Linux cross compiler against
      # its C library (xtask/README.md § `cargo xtask test`), and the image
      # check's tests run dosfstools' fsck.fat (xtask/README.md § The image
      # check).
      # The packages come from the cache entry of this job's runner image,
      # downloaded under a bound when it is absent (docs/build-system.md
      # § Continuous Integration).
      - name: Install the riscv64 test emulation and dosfstools
        uses: ./.github/actions/qemu-packages
        with:
          mode: install
          set: host-tests

      - name: cargo xtask test
        run: cargo xtask test

      - name: Save the build output
        uses: ./.github/actions/carry
        with:
          mode: save
          name: host-tests

  kani:
    # The bounded proofs of the crates the change can affect, one job per
    # crate or shard (.github/workflows/kani.yml; docs/testing.md § Bounded
    # verification); burnin.yml proves every crate. On a pull request or a
    # push, from the base the select job found, so a proof a red or
    # cancelled master run left unproven stays owed; on a dispatch from its
    # input. None proves every crate. A job whose pass a run of this
    # repository stored is not run again unless the dispatch's kani-prove-all
    # asks; reading the stored passes needs `actions: read`.
    needs: select
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/kani.yml
    with:
      skip-passed: ${{ !inputs.kani-prove-all }}
      since: >-
        ${{ github.event_name != 'workflow_dispatch' && needs.select.outputs.base
        || inputs.kani-since }}

  # The gating fuzz tier (docs/testing.md § Fuzzing): the engine's self-test,
  # then every target for the default execution count from seed 0, from the
  # checked-in inputs alone, so a run is reproduced by the same command.
  fuzz:
    # Run when the select job owes it: the change reaches the build of the
    # fuzz targets, the engine or a crate they fuzz, or xtask, which drives
    # them, or the workflows.
    needs: select
    if: needs.select.outputs.fuzz-owed == 'true'
    runs-on: ubuntu-latest
    # The job takes about 19 minutes; each target's run of the default count
    # is capped at 20 minutes (DEFAULT_CAP_SECS of xtask/src/commands/fuzz.rs),
    # and this is the backstop for the rest.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz

      # A working corpus a cache restored would change what the fixed-seed
      # run executes.
      - name: Clear the fuzz working directories
        run: rm -rf target/xtask/fuzz

      - name: cargo xtask fuzz --self-test
        run: cargo xtask fuzz --self-test

      # Each target under the cap of a run of the default count, which fails a
      # target that runs past it, naming it.
      - name: cargo xtask fuzz --all
        run: cargo xtask fuzz --all

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: target/xtask/fuzz/*/crashes/
          if-no-files-found: ignore

  qemu-debs:
    uses: ./.github/workflows/qemu-debs.yml

  build:
    # Each tree the owed cells and the bench cell boot, built once per run
    # and shipped to them as artifacts (the tree action;
    # docs/build-system.md § Continuous Integration): one job per
    # architecture and profile a validate cell is owed in, and the release
    # trees when the bench cell is owed, whose job also builds the
    # benchmark image. The select job lists them; when it lists none, `if`
    # skips the job, since a job of an empty matrix fails. After the
    # qemu-debs job, which seeds the firmware entry and the .deb set of its
    # own image: the build's pack runs the image check's fsck.fat.
    needs: [select, qemu-debs]
    if: needs.select.outputs.build-owed == 'true'
    runs-on: ubuntu-26.04
    # `actions: write` lets a push to master delete the job's superseded
    # build-carry entries (.github/actions/carry).
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.build) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install QEMU and firmware
        # For dosfstools; see docs/build-system.md § Continuous Integration.
        uses: ./.github/actions/qemu-packages
        with:
          mode: install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Restore the build output
        # Master's latest build of this architecture and profile; see
        # docs/build-system.md § Continuous Integration.
        uses: ./.github/actions/carry
        with:
          mode: restore
          name: build-${{ matrix.arch }}-${{ matrix.profile }}

      - name: Place the signing keys outside the checkout
        # The job's first build generates a local root and a signing key in
        # the runner's temporary directory; the tree action ships them to
        # the cells of this run (docs/signing.md § Signing). A job-level env
        # cannot read the runner context, so the path is set for the later
        # steps here.
        run: echo "SERAPH_SIGNING_DIR=$RUNNER_TEMP/seraph-signing" >> "$GITHUB_ENV"

      - name: Build (${{ matrix.arch }}, ${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo xtask build --arch ${{ matrix.arch }} --release
          else
            cargo xtask build --arch ${{ matrix.arch }}
          fi

      - name: Ship the tree
        uses: ./.github/actions/tree
        with:
          mode: ship
          name: tree-${{ matrix.arch }}-${{ matrix.profile }}
          arch: ${{ matrix.arch }}
          boot: 'true'

      - name: Build the benchmark image (${{ matrix.arch }})
        # The release tree with ktest's bench-only tier (docs/testing.md
        # § Benchmarks), the build that runs on hardware; the host-mode bands
        # were calibrated on the same build, so both modes measure one
        # build. The lint pass is the build's above, so only ktest and what
        # its feature reaches compile again.
        if: matrix.bench
        run: cargo xtask build --arch ${{ matrix.arch }} --release --ktest-bench-only --skip-lints

      - name: Ship the benchmark image
        if: matrix.bench
        uses: ./.github/actions/tree
        with:
          mode: ship
          name: tree-${{ matrix.arch }}-bench
          arch: ${{ matrix.arch }}

      - name: Build the idle-wait ktest image
        # The x86_64 debug tree with a focused ktest: the tests that wake
        # threads onto idle CPUs, which the x86_64 debug ktest cell boots a
        # second time on the monitored idle wait (docs/testing.md § Idle wait
        # (ktest cell)). Only when that cell is owed: the select job writes
        # each cell as {"arch":..,"profile":..,"tester":..}, in that key
        # order (xtask/src/commands/cells.rs). The lint pass is the build's
        # above, so only ktest compiles again.
        if: >-
          matrix.arch == 'x86_64' && matrix.profile == 'debug'
          && contains(needs.select.outputs.validate, '{"arch":"x86_64","profile":"debug","tester":"ktest"}')
        run: |
          selection=stress::idle_wake_race,stress::load_balance_handoff_steal
          selection=$selection,integration::idle_pull_starved_ready
          selection=$selection,integration::idle_past_watchdog_threshold
          selection=$selection,integration::rt_push_waiting
          selection=$selection,integration::rt_wake_placement,integration::rt_wake_preempt
          cargo xtask build --arch x86_64 --skip-lints --ktest-only "$selection"

      - name: Ship the idle-wait ktest image
        if: >-
          matrix.arch == 'x86_64' && matrix.profile == 'debug'
          && contains(needs.select.outputs.validate, '{"arch":"x86_64","profile":"debug","tester":"ktest"}')
        uses: ./.github/actions/tree
        with:
          mode: ship
          name: tree-x86_64-idlewait
          arch: x86_64

      - name: Save the build output
        uses: ./.github/actions/carry
        with:
          mode: save
          name: build-${{ matrix.arch }}-${{ matrix.profile }}

  validate:
    # After the build job (and so after the qemu-debs job; see
    # docs/build-system.md § Continuous Integration): a cell boots the tree
    # of its architecture and profile's entry and builds nothing. A job that
    # needs a matrix job starts once every entry has ended, so the cells
    # start after the last build; `if` runs them whatever the other
    # entries' outcomes, so a cell whose tree shipped boots it and one whose
    # build failed fails at its fetch, under its own name. The cells are the
    # ones the select job owes; when it owes none, `if` skips the job,
    # since a job of an empty matrix fails.
    needs: [select, build]
    if: >-
      ${{ !cancelled() && needs.build.result != 'skipped'
      && needs.select.outputs.validate-owed == 'true' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      # Each cell is one of arch [x86_64, riscv64] x profile [debug, release]
      # x tester [svctest, usertest, ktest], in that key order, so its check
      # is named `validate (<arch>, <profile>, <tester>)`. One harness per
      # cell: each cell takes its build job's tree and stages one harness
      # (svctest's recipe with a fixture set, usertest's recipe, or the ktest
      # bundle), then boots it: once, or for svctest twice, its `ci` set
      # and then its `crash-endpoint` set. Avoids
      # back-to-back fatfs/sysroot state accumulation across harnesses
      # and lets a failing tier surface as a single named cell. After its
      # boot, each cell runs the host-driven cases `cargo xtask test`'s
      # registry assigns to its tester (`cargo xtask test --cell`): they
      # need a runner that drives QEMU from the host (QMP, a gdbstub), not
      # `run --runs`, and colocating them avoids a matrix dimension that
      # would multiply with every arch. See docs/testing.md.
      matrix: ${{ fromJSON(needs.select.outputs.validate) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install QEMU and firmware
        # From the cache entry of this cell's own runner image; see
        # docs/build-system.md § Continuous Integration.
        uses: ./.github/actions/qemu-packages
        with:
          mode: install

      - name: Log QEMU versions
        # A missing binary fails here rather than at the first boot. The
        # version floor and the pinned image's QEMU are in
        # docs/build-system.md § QEMU and Firmware and § Continuous Integration.
        run: |
          qemu-system-x86_64 --version
          qemu-system-riscv64 --version

      - name: Report the runner's performance counters
        # Reported only: CI boots x86-64 under TCG, which offers the guest no
        # PMU, so ktest's integration::pmu checks the x86-64 case of a CPU
        # with no counters here (core/kernel/docs/perfmon.md § Testing).
        run: |
          echo "arch_perfmon CPUs: $(grep -c arch_perfmon /proc/cpuinfo || true)"
          echo "perfctr_core CPUs: $(grep -c perfctr_core /proc/cpuinfo || true)"
          echo "kvm enable_pmu: $(cat /sys/module/kvm/parameters/enable_pmu 2>/dev/null || echo absent)"

      - name: Install Rust toolchain
        # The usertest cell alone compiles: its signing and rollback cases
        # build bootloaders under trust stores they generate, from the
        # bootloader's build state its build job ships (docs/build-system.md
        # § Continuous Integration).
        if: matrix.tester == 'usertest'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,llvm-tools

      - name: Fetch the tree (${{ matrix.arch }}, ${{ matrix.profile }})
        # The build job's tree, its xtask binary, which the later steps run
        # as `xtask`, and its signing identity, which every pack signs with.
        uses: ./.github/actions/tree
        with:
          mode: fetch
          name: tree-${{ matrix.arch }}-${{ matrix.profile }}
          arch: ${{ matrix.arch }}
          boot: ${{ matrix.tester == 'usertest' }}

      - name: Stage ${{ matrix.tester }} and repack disk
        # Recipe staging: svctest and usertest live in
        # `sysroot/config/svcmgr/tests/` (svcmgr does not scan that
        # directory). usertest is cp'd into services/ to enable it; svctest is
        # staged by `cargo xtask mkdisk --svctest ci`, which co-stages the
        # `ci` fixture set below and records the set in svctest's staged
        # recipe, and svctest fails a boot whose image stages other fixtures
        # than the record declares (docs/testing.md § Gating). The svctest
        # staging also composes a services-layer image: it drops the
        # programs layer's recipes (the terminal's among them), stages
        # sessiond's and crashd's svctest recipes, and the pack leaves the
        # programs layer (/programs/, /tests/programs/, usertest) out of the
        # image, so svctest's boot runs no program. `cargo xtask mkdisk`
        # re-mirrors rootfs and repacks the FAT image without invoking
        # cargo. ktest swaps the bundle's `init` entry via
        # `cargo xtask mkdisk --harness ktest`, which repacks the disk
        # image with the ktest bundle and nothing on its root and data
        # partitions. Every pack checks the images it writes (fsck.fat -n on
        # every FAT volume, then the partitions against the image's kind,
        # then the ESP against the installed files; xtask/README.md § The
        # image check).
        #
        # The svctest cell's `ci` set co-stages crasher (the restart-path
        # fixture), its worker-fault recipe (crasher-worker.svc) and its
        # boot-fault recipe (crasher-boot.svc, whose first launch dies before
        # its bootstrap request on the token the data partition ships) and
        # its one-shot recipe (crasher-once.svc, restart = never):
        # crasher is non-shutdown, so it shares the boot with
        # svctest without racing pwrmgr shutdown; its bounded faults
        # finish long before svctest's terminal marker. This is the only
        # automated boot crasher runs in. It also co-stages memhog
        # (memhog.svc), the out-of-memory policy service's fixture, which
        # svctest's oom_policy phase has fill memory until oomd stops it,
        # and stopsrc (stopsrc.svc), a stop source of the program class,
        # whose job oomd stops first and whose source svcmgr lists. It also
        # co-stages reserve-creator (reserve-creator.svc), svctest's fixture for
        # a reserve creator's create while memory is critical.
        #
        # The usertest boot also drops the autostarted `terminal` (a
        # user-facing program, not part of the programs substrate under test)
        # so the boot is controlled. `--repack-only` makes the removal and
        # the staging stick: a normal repack re-mirrors rootfs, which would
        # restore terminal.svc. The terminal is exercised in its own boot (the
        # `terminal` case, below).
        #
        # The usertest cell also packs the log-level configuration that sets
        # vfsd to debug (services/init/log-levels-vfsd-debug.conf), and its
        # boot checks that the level reached vfsd and the fatfs it spawns and
        # no other service. The ktest cell also stages the `mapredo` knob, so
        # the bootloader redoes the first attempt of its steps 6 and 7, and
        # its boot checks the bootloader's line for the redo; the boot host
        # test `the_mapredo_knob_redoes_the_first_attempt_alone` holds the redo
        # to one.
        #
        # The `ci` set stages crashd's test recipe over the default one, so
        # crashd writes a core of each crashme death to /crash, which svctest's
        # crashd phases check, and the boot checks the crashme fixture's
        # reports (`--crash-reports reports`, below). The svctest cell's
        # second boot, of the `crash-endpoint` set, stages no crashd, so one
        # boot per arch and profile runs an image without it: svctest takes
        # procmgr's crash endpoint, and the faults it does not take must kill
        # as with no handler and leave no crash report. The usertest image
        # stages no crashd and runs no faulting fixture.
        #
        # `mkdisk --svctest` also stages the test-only device class files of
        # `sysroot/config/devmgr/tests/` (svcmgr does not scan that directory)
        # into `classes/`, and the svctest cell's boot attaches the test devices
        # (`--test-devices`, below) the test-only drivers bind.
        run: |
          case "${{ matrix.tester }}" in
            svctest)
              xtask mkdisk --arch ${{ matrix.arch }} --repack-only \
                --svctest ci
              ;;
            usertest)
              cp sysroot/config/svcmgr/tests/usertest.svc \
                 sysroot/config/svcmgr/services/
              rm -f sysroot/config/svcmgr/services/terminal.svc
              xtask mkdisk --arch ${{ matrix.arch }} --repack-only \
                --log-levels services/init/log-levels-vfsd-debug.conf
              ;;
            ktest)
              xtask mkdisk --arch ${{ matrix.arch }} --harness ktest \
                --knob mapredo
              ;;
          esac

      - name: Run ${{ matrix.tester }}
        # Per-cell boot budget, for HANG classification, derived as
        # docs/build-system.md § Continuous Integration states from each
        # cell's worst pass, over the boots of its image (the cell's boot, and
        # on usertest and ktest the log-level and mapredo boots whose checks
        # its boot carries); the worst passes are beside the values. The
        # svctest worsts are of the 47 passing master runs from 2026-11-24
        # 12:13 to 2026-11-26 07:34 UTC whose head stages the svctest boot
        # with no program (42 passes a cell; the latest attempt of each). The
        # usertest and ktest worsts are of the 174 build-test runs from
        # 2026-11-17 22:44 to 2026-11-18 15:28 UTC (the latest attempt of
        # each); the usertest budgets keep the worst of a boot that still ran
        # the seven testers whose checks svctest's phases took over (crashme,
        # deadline, debugger, pipestress, stdiotest, threadchurn,
        # threadstack), an upper bound until CI's passes re-derive them.
        run: |
          case "${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}" in
            riscv64-debug-svctest)    budget=1380 ;;  # worst pass 448.2 s
            riscv64-debug-usertest)   budget=540 ;;   # worst pass 168.4 s
            riscv64-debug-ktest)      budget=300 ;;   # worst pass 81.9 s
            riscv64-release-svctest)  budget=1020 ;;  # worst pass 327.3 s
            riscv64-release-usertest) budget=240 ;;   # worst pass 66.4 s
            riscv64-release-ktest)    budget=240 ;;   # worst pass 70.9 s
            x86_64-debug-svctest)     budget=840 ;;   # worst pass 278.5 s
            x86_64-debug-usertest)    budget=240 ;;   # worst pass 61.4 s
            x86_64-debug-ktest)       budget=480 ;;   # worst pass 153.3 s
            x86_64-release-svctest)   budget=660 ;;   # worst pass 219.4 s
            x86_64-release-usertest)  budget=180 ;;   # worst pass 39.3 s
            x86_64-release-ktest)     budget=540 ;;   # worst pass 175.8 s
            *) echo "no budget for this cell" >&2; exit 1 ;;
          esac
          # The svctest boot attaches the test devices its devmgr phases drive.
          test_devices=
          if [ "${{ matrix.tester }}" = "svctest" ]; then
            test_devices=--test-devices
          fi
          # Runs one boot the budget bounds. A pass over half its budget has
          # outgrown the worst pass the budget was derived from, a third of
          # the budget or less, so the budget is due for re-derivation before
          # a slower draw of the same boot reaches it; a warning annotation on
          # the run says so and fails nothing.
          budgeted() {
            started=$SECONDS
            "$@"
            took=$((SECONDS - started))
            if [ "$took" -gt $((budget / 2)) ]; then
              echo "::warning title=boot budget::$2 took ${took} s, over half of the cell's ${budget} s budget; re-derive the budgets (docs/build-system.md § Continuous Integration)."
            fi
          }
          # --save-logs keeps every run's log, a PASS included, for the
          # run-saved artifact below, so a cell's per-phase timings
          # can be compared across heads.
          # The boot also checks the crash service's report blocks in its log:
          # the svctest boot ran the crashme fixture with crashd staged, whose
          # reports must be there and well-formed; the usertest image staged
          # no crashd, so its log must hold no crash report.
          crash_reports=
          case "${{ matrix.tester }}" in
            svctest)  crash_reports="--crash-reports reports" ;;
            usertest) crash_reports="--crash-reports none" ;;
          esac
          # The svctest boot also checks that its console stayed whole while
          # its senders, crashd and the kernel wrote at once: svctest's
          # `console_whole_lines` phase brackets its lines with
          # `whole-lines begin` and `whole-lines end` (`--whole-lines`).
          # It checks the same of the lines svctest's `serial_transmit` phase
          # writes to the serial driver while its transmitter is stopped,
          # bracketed with `serial-burst begin` and `serial-burst end`, and of
          # the probe lines svctest's `logd_flood` phase logs under a flood,
          # bracketed with `log-flood begin` and `log-flood end`.
          # The usertest boot also checks the log-level configuration its
          # staging packed: a debug line of vfsd and of the fatfs vfsd spawns,
          # and none of devmgr or procmgr. The ktest boot also checks the
          # bootloader's line for the mapredo knob its staging staged, and fails
          # on a SKIP line: at the cell's 4 CPUs and initial capability set no
          # test's skip condition holds (docs/testing.md § Gating).
          checks=()
          case "${{ matrix.tester }}" in
            svctest)
              checks=(--whole-lines whole-lines --whole-lines serial-burst
                      --whole-lines log-flood) ;;
            usertest)
              checks=(--require 'DEBUG  \[vfsd\] ' --require 'DEBUG  \[fatfs\] '
                      --fail-also 'DEBUG  \[(devmgr|procmgr)\] ') ;;
            ktest)
              checks=(--require 'mapredo knob present; redoing steps 6 and 7'
                      --fail-also ' SKIP ') ;;
          esac
          # The riscv64 debug ktest boot runs on the monitored idle wait
          # (docs/testing.md § Idle wait (ktest cell)), and checks that the
          # kernel took it.
          if [ "${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}" = riscv64-debug-ktest ]; then
            checks+=(--idle-wait on --require 'idle: wait wrs\.nto')
          fi
          budgeted xtask run \
            --arch ${{ matrix.arch }} \
            --runs 1 --timeout "$budget" \
            --save-logs target/xtask/run-saved $test_devices $crash_reports \
            "${checks[@]}"

      - name: Run svctest's crash-endpoint boot
        if: matrix.tester == 'svctest'
        # The `crash-endpoint` set: no fixture and no crashd, and svctest runs
        # its startup and fixture-check phases and the crash_endpoint phase,
        # which takes procmgr's crash endpoint (docs/testing.md § Gating). Its
        # log must hold no crash report. Its budget follows the cell's rule
        # (docs/build-system.md § Continuous Integration) from an estimated
        # worst: the svctest cell's worst time to the end of its
        # svctest_fixtures phase plus its crash_endpoint phase, in the 8 master
        # runs above, and 5 s for the firmware and the power-off; its logs go
        # to their own directory, since
        # a saved log is named by its architecture, CPU count and run alone.
        run: |
          xtask mkdisk --arch ${{ matrix.arch }} --repack-only \
            --svctest crash-endpoint
          case "${{ matrix.arch }}-${{ matrix.profile }}" in
            riscv64-debug)    budget=180 ;;  # worst pass 20.7 s (est.)
            riscv64-release)  budget=120 ;;  # worst pass 13.0 s (est.)
            x86_64-debug)     budget=120 ;;  # worst pass 14.6 s (est.)
            x86_64-release)   budget=120 ;;  # worst pass 11.3 s (est.)
            *) echo "no budget for this cell" >&2; exit 1 ;;
          esac
          xtask run \
            --arch ${{ matrix.arch }} \
            --runs 1 --timeout "$budget" \
            --save-logs target/xtask/run-saved/crash-endpoint --test-devices \
            --crash-reports none

      - name: Run ${{ matrix.tester }}'s cases
        # The host-driven cases of `cargo xtask test`'s registry this cell's
        # tester runs (xtask/README.md § `cargo xtask test`; docs/testing.md
        # § Coverage tiers): on usertest the terminal, wedge, shutdown,
        # signing, dma-confinement, rollback, enrolment, secureboot and
        # storage-roles cases, and vmgenid on x86_64; on ktest the kaslr case;
        # svctest has none. Each case boots its bundle's image unstaged, but
        # for what the case stages itself, so the plain repack first
        # re-mirrors rootfs (dropping the staged
        # test recipes and restoring terminal.svc), installs the repository's
        # log-level configuration, and removes the knobs, keeping the
        # recorded harness. The signing and rollback cases build their
        # bootloaders in the cell's profile. Each case runs whatever another's outcome,
        # and the step fails naming the cases that failed. The cases run in
        # three lanes side by side, each on its own copy of the checkout,
        # since each boot keeps about one of the runner's four vCPUs busy
        # (xtask/README.md § Cells); the step reports each case's and each
        # lane's wall and CPU time.
        run: |
          xtask mkdisk --arch ${{ matrix.arch }}
          release=
          if [ "${{ matrix.profile }}" = "release" ]; then
            release=--release
          fi
          xtask test --cell ${{ matrix.tester }} --arch ${{ matrix.arch }} $release \
            --lanes 3

      - name: Fetch the idle-wait ktest image
        # The focused ktest the x86_64 debug build job built, over the cell's
        # tree, after the cell's cases, which boot the full one.
        if: matrix.arch == 'x86_64' && matrix.profile == 'debug' && matrix.tester == 'ktest'
        uses: ./.github/actions/tree
        with:
          mode: fetch
          name: tree-x86_64-idlewait
          arch: x86_64

      - name: Run the idle-wait ktest
        # The focused ktest on the monitored idle wait (docs/testing.md § Idle
        # wait (ktest cell)): its pass marker is the focused one
        # (--ktest-only-ok), and the boot checks that the kernel took MWAIT.
        # Under TCG an idle vCPU on the wait spins on its host thread; the
        # budget is a bound until CI's passes give a worst pass to derive it
        # from.
        if: matrix.arch == 'x86_64' && matrix.profile == 'debug' && matrix.tester == 'ktest'
        run: |
          xtask mkdisk --arch x86_64 --harness ktest
          xtask run --arch x86_64 --idle-wait on --ktest-only-ok \
            --runs 1 --timeout 120 --save-logs target/xtask/run-saved/idle-wait \
            --require 'idle: wait mwait' --fail-also ' SKIP '

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}
          path: |
            target/xtask/run/**/*.log
            target/xtask/run/**/*.crash.txt
            target/xtask/test/*/*/*.log
            target/xtask/lanes/**/*.log
            target/xtask/lanes/**/*.crash.txt
          if-no-files-found: ignore

      - name: Upload saved run logs
        # Every run's log, a PASS included, kept only as long as a cross-head
        # timing comparison needs; the failure logs above keep the
        # repository's default retention.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-saved-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}
          path: |
            target/xtask/run-saved/*.log
            target/xtask/run-saved/*.crash.txt
            target/xtask/run-saved/crash-endpoint/*.log
            target/xtask/run-saved/crash-endpoint/*.crash.txt
            target/xtask/run-saved/idle-wait/*.log
            target/xtask/run-saved/idle-wait/*.crash.txt
          if-no-files-found: ignore
          retention-days: 14


  bench:
    # The benchmark cell: the bench-only ktest image and the userspace ubench
    # suite of each architecture, booted under QEMU's icount, whose counts
    # repeat from run to run, and their one-CPU counts held to the checked-in
    # baselines (xtask/README.md § `cargo xtask bench-check`; docs/testing.md
    # § Gating). After the
    # build job, whose release entry of the cell's architecture builds its
    # image, and run whatever the other entries' outcomes, as validate is;
    # see docs/build-system.md § Continuous Integration. The select job owes the cell, and within it the ktest
    # boots apart: when it does not owe them they are skipped, and so are
    # the ktest suite's baselines.
    needs: [select, build]
    if: >-
      ${{ !cancelled() && needs.build.result != 'skipped'
      && needs.select.outputs.bench-owed == 'true' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.bench) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install QEMU and firmware
        uses: ./.github/actions/qemu-packages
        with:
          mode: install

      - name: Install Rust toolchain
        # For the compiler version `bench-check` records with the counts; the
        # cell compiles nothing.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10

      - name: Fetch the benchmark image (${{ matrix.arch }})
        # The release tree with ktest's bench-only tier, which the build job
        # of the architecture's release tree builds; as validate's step of
        # the same kind.
        uses: ./.github/actions/tree
        with:
          mode: fetch
          name: tree-${{ matrix.arch }}-bench
          arch: ${{ matrix.arch }}

      - name: Pack the ktest image (${{ matrix.arch }})
        run: xtask mkdisk --arch ${{ matrix.arch }} --harness ktest

      - name: Boot it under icount
        if: needs.select.outputs.ktest-bench == 'true'
        # Three one-CPU runs, whose counts the gate compares, and one
        # four-CPU run, whose counts it reports. A boot takes about 15 s.
        run: |
          xtask run --arch ${{ matrix.arch }} --icount --cpus 1 \
            --runs 3 --timeout 300 --save-logs target/xtask/bench
          xtask run --arch ${{ matrix.arch }} --icount --cpus 4 \
            --runs 1 --timeout 300 --save-logs target/xtask/bench

      - name: Stage the ubench suite (${{ matrix.arch }})
        # The init harness's services-layer image with ubench's recipe staged
        # (`mkdisk --ubench`): it holds no program, so no terminal adds output
        # of its own to the framebuffer console_write measures (logd's mirror
        # of the log lines still does) (services/ubench/README.md § Running).
        run: |
          xtask mkdisk --arch ${{ matrix.arch }} --harness init --ubench

      - name: Boot ubench under icount
        # As the ktest boots, with a framebuffer for console_write; the logs
        # go to their own directory, since a saved log is named by its
        # architecture, CPU count and run alone.
        run: |
          xtask run --arch ${{ matrix.arch }} --icount --cpus 1 \
            --display framebuffer --runs 3 --timeout 900 \
            --save-logs target/xtask/bench/ubench
          xtask run --arch ${{ matrix.arch }} --icount --cpus 4 \
            --display framebuffer --runs 1 --timeout 900 \
            --save-logs target/xtask/bench/ubench

      - name: cargo xtask bench-check
        # Writes the cell's environment beside its logs, for
        # `cargo xtask bench-baseline --from-run`, whose rewrite leaves the
        # files of a suite the logs measure nothing of.
        shell: bash
        env:
          KTEST: ${{ needs.select.outputs.ktest-bench }}
        run: |
          if [ "$KTEST" = true ]; then
            ktest=(target/xtask/bench/*.log)
          else
            ktest=(--skip-suite ktest)
          fi
          xtask bench-check --mode icount \
            --write-env target/xtask/bench/ENV "${ktest[@]}" \
            target/xtask/bench/ubench/*.log

      - name: Upload the benchmark logs
        # `cargo xtask bench-baseline --from-run <run id>` reads them.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.arch }}
          path: |
            target/xtask/bench/*.log
            target/xtask/bench/ubench/*.log
            target/xtask/bench/ENV
          if-no-files-found: ignore

  summary:
    # The one check branch protection requires (docs/conventions.md § Branch
    # protection): it fails when a job failed or was cancelled, or was
    # skipped although the select job owed it; a job skipped because the
    # change owes it nothing passes. A check that never reports blocks a
    # merge, so the cells, which run only when owed, are not required
    # checks themselves.
    needs: [select, host-tests, kani, fuzz, qemu-debs, build, validate, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Judge the jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          VALIDATE_OWED: ${{ needs.select.outputs.validate-owed }}
          BUILD_OWED: ${{ needs.select.outputs.build-owed }}
          BENCH_OWED: ${{ needs.select.outputs.bench-owed }}
          FUZZ_OWED: ${{ needs.select.outputs.fuzz-owed }}
        run: |
          failed=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            case "$job" in
              validate) owed=$VALIDATE_OWED ;;
              build) owed=$BUILD_OWED ;;
              bench) owed=$BENCH_OWED ;;
              fuzz) owed=$FUZZ_OWED ;;
              *) owed=true ;;
            esac
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$owed" != true ]; }; then
              echo "$job: $result (owed: $owed)"
            else
              echo "::error title=summary::$job: $result (owed: $owed)"
              failed=1
            fi
          done
          exit $failed
