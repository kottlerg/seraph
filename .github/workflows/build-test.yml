# Probe of required-check behaviour on this repository; not for merge.
name: build-test

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  host-tests:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-0:
    name: "validate (x86_64, debug, ktest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-1:
    name: "validate (x86_64, debug, svctest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-2:
    name: "validate (x86_64, debug, usertest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-3:
    name: "validate (x86_64, release, ktest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-4:
    name: "validate (x86_64, release, svctest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-5:
    name: "validate (x86_64, release, usertest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-6:
    name: "validate (riscv64, debug, ktest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-7:
    name: "validate (riscv64, debug, svctest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-8:
    name: "validate (riscv64, debug, usertest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-10:
    name: "validate (riscv64, release, svctest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  req-11:
    name: "validate (riscv64, release, usertest)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  select:
    runs-on: ubuntu-latest
    outputs:
      subset: ${{ steps.s.outputs.subset }}
      empty: ${{ steps.s.outputs.empty }}
    steps:
      - id: s
        run: |
          echo 'subset={"include":[{"arch":"x86_64","profile":"debug","tester":"svctest"}]}' >> "$GITHUB_OUTPUT"
          echo 'empty={"include":[]}' >> "$GITHUB_OUTPUT"

  probe-matrix:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.subset) }}
    steps:
      - run: echo "${{ matrix.arch }} ${{ matrix.profile }} ${{ matrix.tester }}"

  probe-empty-guarded:
    needs: select
    if: needs.select.outputs.empty != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.empty) }}
    steps:
      - run: "true"

  probe-skipped-matrix:
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, riscv64]
    steps:
      - run: "true"


  summary:
    needs: [host-tests, select, probe-matrix, probe-empty-guarded, probe-skipped-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs) }}'
