# .github/workflows/build-test.yml

# The canonical CI tier: host tests and the architecture x profile x harness
# boots every push and pull request runs (docs/build-system.md
# § Continuous Integration).

name: build-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A pull request's newer push cancels its older run. Every other run (each
# push to master, each merge commit among them) is grouped by its commit, so
# no later run cancels or replaces it: each merge commit gets its own run
# (docs/conventions.md § CI Gating).
concurrency:
  group: build-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # commit-check reads the pull request's commits back to the base
          # branch; the default depth of 1 holds only the merge commit.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-tests

      - name: cargo xtask lint-docs
        run: cargo xtask lint-docs

      - name: cargo xtask commit-check
        if: github.event_name == 'pull_request'
        run: >-
          cargo xtask commit-check
          --base origin/${{ github.base_ref }}
          --head ${{ github.event.pull_request.head.sha }}

      # `cargo xtask test` also runs the tests built for riscv64 under QEMU's
      # user-mode emulator, linked by the riscv64 Linux cross compiler against
      # its C library (xtask/README.md § `cargo xtask test`).
      - name: Install the riscv64 test emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: cargo xtask test
        run: cargo xtask test

  qemu-debs:
    uses: ./.github/workflows/qemu-debs.yml

  validate:
    # Pinned with the qemu-debs job's image; see docs/build-system.md
    # § Continuous Integration.
    needs: qemu-debs
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64]
        profile: [debug, release]
        # One harness per cell: each cell builds once, stages exactly one
        # recipe (or swaps boot.conf for ktest), then runs once. Avoids
        # back-to-back fatfs/sysroot state accumulation across harnesses
        # and lets a failing tier surface as a single named cell. The
        # usertest cell additionally runs the terminal interactive test as
        # a further boot — it needs the QMP `test-terminal` runner (not
        # `run --runs`), and colocating it (both programs-surface) avoids a
        # matrix dimension that would multiply with every arch. See
        # docs/testing.md.
        tester: [svctest, usertest, ktest]
    steps:
      - uses: actions/checkout@v6

      - name: Restore QEMU and firmware packages
        uses: actions/cache/restore@v6
        with:
          path: qemu-debs
          key: ${{ needs.qemu-debs.outputs.key }}

      - name: Install QEMU and firmware
        # See docs/build-system.md § Continuous Integration.
        uses: ./.github/actions/qemu-packages
        with:
          mode: install
          dir: qemu-debs

      - name: Log QEMU versions
        # A missing binary fails here rather than at the first boot. The
        # version floor and the pinned image's QEMU are in
        # docs/build-system.md § QEMU and Firmware and § Continuous Integration.
        run: |
          qemu-system-x86_64 --version
          qemu-system-riscv64 --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: validate-${{ matrix.arch }}-${{ matrix.profile }}

      - name: Place the signing keys outside the checkout
        # The job's first build generates a local root and a signing key in
        # the runner's temporary directory, which the runner discards with the
        # job (docs/signing.md § Signing). A job-level env cannot read the
        # runner context, so the path is set for the later steps here.
        run: echo "SERAPH_SIGNING_DIR=$RUNNER_TEMP/seraph-signing" >> "$GITHUB_ENV"

      - name: Build (${{ matrix.arch }}, ${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo xtask build --arch ${{ matrix.arch }} --release
          else
            cargo xtask build --arch ${{ matrix.arch }}
          fi

      - name: Stage ${{ matrix.tester }} and repack disk
        # Recipe staging: svctest and usertest live in
        # `sysroot/config/svcmgr/tests/` (svcmgr does not scan that
        # directory); cp into services/ to enable. `cargo xtask mkdisk`
        # re-mirrors rootfs and repacks the FAT image without invoking
        # cargo. ktest swaps the bundle's `init` entry via
        # `cargo xtask compose-bundle --harness ktest`, which repacks
        # the disk image as part of the compose step.
        #
        # The svctest cell also co-stages crasher (the restart-path
        # fixture), its worker-fault recipe (crasher-worker.svc) and its
        # boot-fault recipe (crasher-boot.svc, whose first launch dies before
        # its bootstrap request on the token the data partition ships):
        # crasher is non-shutdown, so it shares the boot with
        # svctest without racing pwrmgr shutdown; its bounded faults
        # finish long before svctest's terminal marker. This is the only
        # automated boot crasher runs in. It also co-stages memhog
        # (memhog.svc), the out-of-memory policy service's fixture, which
        # svctest's oom_policy phase has fill memory until oomd stops it,
        # and stopsrc (stopsrc.svc), a stop source of the program class,
        # whose job oomd stops first and whose source svcmgr lists.
        #
        # The functional harness boots also drop the autostarted `terminal`
        # (a user-facing program, not part of the services/programs substrate
        # under test) so the boot is controlled. `--repack-only` makes the
        # removal stick: a normal repack re-mirrors rootfs, which would restore
        # terminal.svc. The terminal is exercised in its own boot
        # (test-terminal, below).
        #
        # The svctest cell also drops crashd (the crash service, default-on), so
        # one boot per arch and profile runs an image without it: its faults,
        # crasher's among them, must kill as with no handler and leave no crash
        # report (`--crash-reports none` on its boot, below). The usertest cell
        # keeps crashd and checks the crashme fixture's reports; it stages
        # crashd's test recipe over the default one, so crashd also writes a
        # core of each crashme death to /crash, which the crashme tester checks.
        #
        # The svctest cell also stages the test-only device class files of
        # `sysroot/config/devmgr/tests/` (svcmgr does not scan that directory)
        # into `classes/`, and its boot attaches the test devices
        # (`--test-devices`, below) the test-only drivers bind.
        run: |
          case "${{ matrix.tester }}" in
            svctest)
              cp sysroot/config/svcmgr/tests/svctest.svc \
                 sysroot/config/svcmgr/services/
              cp sysroot/config/devmgr/tests/*.class \
                 sysroot/config/devmgr/classes/
              cp sysroot/config/svcmgr/tests/crasher.svc \
                 sysroot/config/svcmgr/tests/crasher-worker.svc \
                 sysroot/config/svcmgr/tests/crasher-boot.svc \
                 sysroot/config/svcmgr/tests/memhog.svc \
                 sysroot/config/svcmgr/tests/stopsrc.svc \
                 sysroot/config/svcmgr/services/
              rm -f sysroot/config/svcmgr/services/terminal.svc
              rm -f sysroot/config/svcmgr/services/crashd.svc
              cargo xtask mkdisk --arch ${{ matrix.arch }} --repack-only
              ;;
            usertest)
              cp sysroot/config/svcmgr/tests/usertest.svc \
                 sysroot/config/svcmgr/tests/crashd.svc \
                 sysroot/config/svcmgr/services/
              rm -f sysroot/config/svcmgr/services/terminal.svc
              cargo xtask mkdisk --arch ${{ matrix.arch }} --repack-only
              ;;
            ktest)
              cargo xtask compose-bundle --arch ${{ matrix.arch }} --harness ktest
              ;;
          esac

      - name: Check the disk image
        # fsck.fat -n, a reader independent of xtask's FAT writer, on every
        # FAT volume of the image the cell boots, then that every object on
        # its ESP equals its installed file on the root partition; see
        # xtask/README.md § cargo xtask check-disk.
        run: cargo xtask check-disk

      - name: Run ${{ matrix.tester }}
        # Per-cell boot budget, for HANG classification, derived as
        # docs/build-system.md § Continuous Integration states from each
        # cell's worst pass, over every boot the budget bounds (run,
        # test-map-redo, test-log-level), in the 174 build-test runs from
        # 2026-11-17 22:44 to 2026-11-18 15:28 UTC (the latest attempt of
        # each); the worst passes are beside the values. riscv64 debug
        # svctest's three runs that the previous 300 s budget cut short were
        # still passing phases; its worst is the slowest one's projected
        # completion (the phases it had left, at its own pace, from a passing
        # run's log), above the 297.5 s of its worst observed pass.
        run: |
          case "${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}" in
            riscv64-debug-svctest)    budget=1140 ;;  # worst pass 372.3 s
            riscv64-debug-usertest)   budget=540 ;;   # worst pass 168.4 s
            riscv64-debug-ktest)      budget=300 ;;   # worst pass 81.9 s
            riscv64-release-svctest)  budget=660 ;;   # worst pass 201.0 s
            riscv64-release-usertest) budget=240 ;;   # worst pass 66.4 s
            riscv64-release-ktest)    budget=240 ;;   # worst pass 70.9 s
            x86_64-debug-svctest)     budget=480 ;;   # worst pass 159.0 s
            x86_64-debug-usertest)    budget=240 ;;   # worst pass 61.4 s
            x86_64-debug-ktest)       budget=480 ;;   # worst pass 153.3 s
            x86_64-release-svctest)   budget=420 ;;   # worst pass 129.5 s
            x86_64-release-usertest)  budget=180 ;;   # worst pass 39.3 s
            x86_64-release-ktest)     budget=540 ;;   # worst pass 175.8 s
            *) echo "no budget for this cell" >&2; exit 1 ;;
          esac
          # The svctest boot attaches the test devices its devmgr phases drive.
          test_devices=
          if [ "${{ matrix.tester }}" = "svctest" ]; then
            test_devices=--test-devices
          fi
          # Runs one boot the budget bounds. A pass over half its budget has
          # outgrown the worst pass the budget was derived from, a third of
          # the budget or less, so the budget is due for re-derivation before
          # a slower draw of the same boot reaches it; a warning annotation on
          # the run says so and fails nothing.
          budgeted() {
            started=$SECONDS
            "$@"
            took=$((SECONDS - started))
            if [ "$took" -gt $((budget / 2)) ]; then
              echo "::warning title=boot budget::$3 took ${took} s, over half of the cell's ${budget} s budget; re-derive the budgets (docs/build-system.md § Continuous Integration)."
            fi
          }
          # --save-logs keeps every run's log, a PASS included, for the
          # run-saved artifact below, so a cell's per-phase timings
          # can be compared across heads.
          # The boot also checks the crash service's report blocks in its log:
          # the svctest image staged no crashd, so its log must hold no crash
          # report; the usertest boot ran the crashme fixture with crashd
          # staged, whose reports must be there and well-formed.
          crash_reports=
          case "${{ matrix.tester }}" in
            svctest)  crash_reports="--crash-reports none" ;;
            usertest) crash_reports="--crash-reports reports" ;;
          esac
          budgeted cargo xtask run \
            --arch ${{ matrix.arch }} \
            --runs 1 --timeout "$budget" \
            --save-logs target/xtask/run-saved $test_devices $crash_reports
          if [ "${{ matrix.tester }}" = "ktest" ]; then
            # Extra boots: the KASLR randomization test (#252). Boots the
            # ktest bundle already composed above twice and asserts the
            # image slide and direct-map base differ, then asserts the
            # --no-kaslr knob yields the deterministic layout. Host-side
            # (it must observe the layout differing across separate boots),
            # so it cannot ride `run --runs`; both arches.
            cargo xtask test-kaslr --arch ${{ matrix.arch }}
            # Extra boot: the steps 6 and 7 redo test (#754). Stages the
            # mapredo knob, so the bootloader redoes its first page-table and
            # memory-map attempt, and boots the ktest bundle to its pass
            # marker under the cell's budget; the knob is removed afterwards.
            budgeted cargo xtask test-map-redo --arch ${{ matrix.arch }} --timeout "$budget"
          fi
          if [ "${{ matrix.tester }}" = "usertest" ]; then
            # Second boot: the log-level configuration test (#936). Installs a
            # configuration setting vfsd to debug and packs the default-init
            # bundle, boots the usertest staging above under the cell's budget,
            # and checks that vfsd's and fatfs's debug lines appear and
            # devmgr's and procmgr's do not; the installed configuration and
            # the recorded harness's bundle are put back afterwards.
            budgeted cargo xtask test-log-level --arch ${{ matrix.arch }} --timeout "$budget"
            # Third boot: the terminal interactive test (keyboard and serial
            # input through the terminal, and keyboard input again after a
            # restart of the input driver, killed through the GDB stub the
            # test stages and removes). It needs the QMP `test-terminal` runner
            # (host-side key injection) and so cannot ride `run --runs`;
            # colocated here (both programs-surface) to avoid a separate
            # matrix dimension. Drop usertest.svc and repack with the rootfs
            # re-mirror, which restores terminal.svc — yielding exactly the
            # default interactive boot that `cargo xtask run` produces.
            rm -f sysroot/config/svcmgr/services/usertest.svc
            cargo xtask mkdisk --arch ${{ matrix.arch }}
            cargo xtask test-terminal --arch ${{ matrix.arch }}
            # Fourth boot pair: the interrupts-off wedge test (#33). Wedges an
            # idle AP, then the BSP, through QEMU's gdbstub and checks the
            # softlockup watchdog's report, on x86_64 with the wedged CPU's
            # own NMI frame; host-side over the gdbstub, so it cannot ride
            # `run --runs`. Reuses the default interactive boot.
            cargo xtask test-wedge --arch ${{ matrix.arch }}
            # Fifth boot: the reboot test. Stages the reboot fixture, whose
            # pwrmgr REBOOT must reset the machine (through acpid's
            # RESET_REG write on x86_64, SBI on riscv64), read from QMP's
            # SHUTDOWN event; host-side over QMP, so it cannot ride
            # `run --runs`. Restores the default interactive boot after.
            cargo xtask test-reboot --arch ${{ matrix.arch }}
            # Sixth boot set: the core-death test (#262). One boot per core or
            # critical service (memmgr, procmgr and its reaper thread, svcmgr,
            # devmgr, vfsd, logd until its restart budget is spent), each
            # killed by a terminal fault made from outside the guest (the GDB
            # stub service, or QEMU's gdbstub for the init-created memmgr and
            # procmgr), and each must power the system off, read from QMP's
            # SHUTDOWN event; host-side, so it cannot ride `run --runs`.
            # Reuses the default interactive boot, and repacks it as it was
            # after each stub boot.
            cargo xtask test-core-death --arch ${{ matrix.arch }}
            # Seventh boot set: the signature refusal test (#124). Builds a
            # bootloader under a store revoking the signing key in the cell's
            # profile, then boots four images carrying a tampered kernel, a
            # tampered bundle entry, that bootloader, and tampered,
            # wrong-role and foreign-signed rootfs images, and checks each
            # verifier's refusal line; host-side, so it cannot ride
            # `run --runs`. Packs the default interactive boot again after.
            if [ "${{ matrix.profile }}" = "release" ]; then
              cargo xtask test-signing --arch ${{ matrix.arch }} --release
            else
              cargo xtask test-signing --arch ${{ matrix.arch }}
            fi
            if [ "${{ matrix.arch }}" = "x86_64" ]; then
              # Eighth boot pair: the VMGENID snapshot-resume test (#395).
              # x86_64 only (QEMU's riscv64 virt machine has no VMGENID);
              # host-side QMP migrate/restore, so it cannot ride
              # `run --runs`. Reuses the default interactive boot the
              # test-reboot restore left.
              cargo xtask test-vmgenid
              # Ninth boot: the power-button test. x86_64 only (QEMU's
              # riscv64 virt machine has no fixed power button); presses the
              # ACPI power button over QMP once acpid has armed its events,
              # and pwrmgr must power off through acpid. Host-side over QMP,
              # so it cannot ride `run --runs`. Reuses the default
              # interactive boot.
              cargo xtask test-powerbutton
            fi
          fi

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}
          path: |
            target/xtask/run/**/*.log
            target/xtask/run/**/*.crash.txt
            target/xtask/test-signing/*/*.log
          if-no-files-found: ignore

      - name: Upload saved run logs
        # Every run's log, a PASS included, kept only as long as a cross-head
        # timing comparison needs; the failure logs above keep the
        # repository's default retention.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-saved-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}
          path: |
            target/xtask/run-saved/*.log
            target/xtask/run-saved/*.crash.txt
          if-no-files-found: ignore
          retention-days: 14
