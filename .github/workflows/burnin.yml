name: burn-in

on:
  push:
    tags: ['v*.*.*']
  # Intentionally unguarded for branch refs (unlike release.yml): a manual
  # dispatch stress-tests whatever ref it targets and mints no version-named
  # artifacts. Release certification reads the tag-push run only.
  workflow_dispatch:

concurrency:
  group: burnin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The QEMU and firmware install list. Moves with the runner-image pin and
  # the qemu-debs cache key; see docs/build-system.md § Continuous Integration.
  QEMU_PACKAGES: qemu-system-x86 qemu-system-riscv ovmf qemu-efi-riscv64

jobs:
  qemu-debs:
    # Downloads the install list's packages once per runner image and install
    # list, into a cache every booting cell restores. Pinned with the booting
    # job's image; see docs/build-system.md § Continuous Integration.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Compute cache key
        id: key
        run: |
          : "${ImageOS:?}" "${ImageVersion:?}"
          list_hash=$(printf '%s' "$QEMU_PACKAGES" | sha256sum | cut -c1-16)
          echo "key=qemu-debs-$ImageOS-$ImageVersion-$list_hash" >> "$GITHUB_OUTPUT"

      - name: Look up cached packages
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: qemu-debs
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Download QEMU and firmware packages
        if: steps.cache.outputs.cache-hit != 'true'
        # The image's mirror (azure.archive.ubuntu.com) can trickle the
        # archives for many minutes; past 120 s the fetch is retried once
        # against archive.ubuntu.com. The rewrite covers both the image's
        # mirror list (/etc/apt/apt-mirrors.txt) and plain source URIs.
        run: |
          debs="$PWD/qemu-debs"
          mkdir -p "$debs/partial"
          fetch() {
            sudo timeout "$1" sh -c "apt-get update && \
              apt-get install -y --download-only --no-install-recommends \
                -o Dir::Cache::Archives=$debs $QEMU_PACKAGES"
          }
          if ! fetch 120; then
            echo "::warning::apt fetch from the image's mirror failed or exceeded 120 s; retrying on archive.ubuntu.com"
            sudo grep -rlI 'azure\.archive\.ubuntu\.com' /etc/apt \
              | xargs -r sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
            fetch 1200
          fi
          sudo rm -rf "$debs/partial" "$debs/lock"
          ls -l "$debs"/*.deb

      - name: Save packages
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: qemu-debs
          key: ${{ steps.key.outputs.key }}

  burnin:
    # Pinned with the install list and the qemu-debs job; see
    # docs/build-system.md § Continuous Integration.
    needs: qemu-debs
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64]
        profile: [debug, release]
        # One harness per cell, matching build-test.yml: each cell builds
        # once, stages exactly one recipe (or swaps boot.conf for ktest),
        # then burns it in. Avoids back-to-back fatfs/sysroot state
        # accumulation across harnesses and lets a failing tier surface as
        # a single named cell. See docs/testing.md for the recipe-dir
        # gating contract.
        tester: [ktest, svctest, usertest]
    steps:
      - uses: actions/checkout@v6

      - name: Restore QEMU and firmware packages
        uses: actions/cache/restore@v6
        with:
          path: qemu-debs
          key: ${{ needs.qemu-debs.outputs.key }}

      - name: Install QEMU and firmware
        # Offline from the qemu-debs job's packages: apt's sources are
        # disabled, so a dependency missing from the set fails resolution
        # instead of fetching. The network install runs only when the cache
        # entry is absent or was resolved against a different image.
        run: |
          if ls qemu-debs/*.deb > /dev/null 2>&1 &&
             sudo apt-get install -y --no-install-recommends \
               -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts=- \
               ./qemu-debs/*.deb; then
            exit 0
          fi
          echo "::warning::offline install from the qemu-debs cache failed; installing from the network"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $QEMU_PACKAGES

      - name: Log QEMU versions
        # A missing binary fails here rather than at the first boot. The
        # version floor and the pinned image's QEMU are in
        # docs/build-system.md § QEMU and Firmware and § Continuous Integration.
        run: |
          qemu-system-x86_64 --version
          qemu-system-riscv64 --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-23
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: burnin-${{ matrix.arch }}-${{ matrix.profile }}

      - name: Build (${{ matrix.arch }}, ${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo xtask build --arch ${{ matrix.arch }} --release
          else
            cargo xtask build --arch ${{ matrix.arch }}
          fi

      - name: Stage ${{ matrix.tester }} and repack disk
        # Recipe staging: svctest and usertest live in
        # `sysroot/config/svcmgr/tests/` (svcmgr does not scan that
        # directory); cp into services/ to enable. These functional harness
        # boots drop the autostarted `terminal` (a user-facing program, not
        # part of the services/programs substrate under test) so the boot is
        # controlled. `--repack-only` makes the removal stick: a normal repack
        # re-mirrors rootfs, which would restore terminal.svc. ktest swaps the
        # bundle's `init` entry via `cargo xtask compose-bundle --harness
        # ktest`, which repacks the disk image as part of the compose step.
        run: |
          case "${{ matrix.tester }}" in
            svctest)
              cp sysroot/config/svcmgr/tests/svctest.svc \
                 sysroot/config/svcmgr/services/
              rm -f sysroot/config/svcmgr/services/terminal.svc
              cargo xtask mkdisk --arch ${{ matrix.arch }} --repack-only
              ;;
            usertest)
              cp sysroot/config/svcmgr/tests/usertest.svc \
                 sysroot/config/svcmgr/services/
              rm -f sysroot/config/svcmgr/services/terminal.svc
              cargo xtask mkdisk --arch ${{ matrix.arch }} --repack-only
              ;;
            ktest)
              cargo xtask compose-bundle --arch ${{ matrix.arch }} --harness ktest
              ;;
          esac

      - name: Burn in ${{ matrix.tester }} (20 iterations, 2 parallel)
        run: |
          cargo xtask run-parallel \
            --arch ${{ matrix.arch }} \
            --parallel 2 --runs 20 --timeout 180

      - name: Upload run-parallel logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: burnin-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}
          path: target/xtask/run-parallel/**/*.log
          if-no-files-found: ignore
