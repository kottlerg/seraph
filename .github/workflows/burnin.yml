# .github/workflows/burnin.yml

# The burn-in tier: each canonical boot repeated, on a tag push or a manual
# dispatch, and every bounded proof (docs/testing.md § Coverage tiers,
# § Bounded verification).

name: burn-in

on:
  push:
    tags: ['v*.*.*']
  # Intentionally unguarded for branch refs (unlike release.yml): a manual
  # dispatch stress-tests whatever ref it targets and mints no version-named
  # artifacts. Release certification reads the tag-push run only.
  workflow_dispatch:

concurrency:
  group: burnin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qemu-debs:
    uses: ./.github/workflows/qemu-debs.yml

  burnin:
    # After the qemu-debs job, which seeds the firmware entry and the .deb
    # set of its own image; see docs/build-system.md § Continuous
    # Integration.
    needs: qemu-debs
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64]
        profile: [debug, release]
        # One harness per cell, as in build-test.yml: each cell builds
        # once, stages exactly one recipe (or swaps boot.conf for ktest),
        # then burns it in. Avoids back-to-back fatfs/sysroot state
        # accumulation across harnesses and lets a failing tier surface as
        # a single named cell. See docs/testing.md for the recipe-dir
        # gating contract.
        tester: [ktest, svctest, usertest]
    steps:
      - uses: actions/checkout@v6

      - name: Install QEMU and firmware
        # From the cache entry of this cell's own runner image; see
        # docs/build-system.md § Continuous Integration.
        uses: ./.github/actions/qemu-packages
        with:
          mode: install

      - name: Log QEMU versions
        # A missing binary fails here rather than at the first boot. The
        # version floor and the pinned image's QEMU are in
        # docs/build-system.md § QEMU and Firmware and § Continuous Integration.
        run: |
          qemu-system-x86_64 --version
          qemu-system-riscv64 --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: burnin-${{ matrix.arch }}-${{ matrix.profile }}

      - name: Place the signing keys outside the checkout
        # The job's first build generates a local root and a signing key in
        # the runner's temporary directory, which the runner discards with the
        # job (docs/signing.md § Signing). A job-level env cannot read the
        # runner context, so the path is set for the later steps here.
        run: echo "SERAPH_SIGNING_DIR=$RUNNER_TEMP/seraph-signing" >> "$GITHUB_ENV"

      - name: Build (${{ matrix.arch }}, ${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo xtask build --arch ${{ matrix.arch }} --release
          else
            cargo xtask build --arch ${{ matrix.arch }}
          fi

      - name: Stage ${{ matrix.tester }} and repack disk
        # Recipe staging: svctest and usertest live in
        # `sysroot/config/svcmgr/tests/` (svcmgr does not scan that
        # directory). usertest is cp'd into services/ to enable it; svctest is
        # staged by `cargo xtask mkdisk --svctest burn-in`, which co-stages the
        # `burn-in` fixture set below and records it in svctest's staged
        # recipe (docs/testing.md § Gating). These functional harness
        # boots drop the autostarted `terminal` (a user-facing program, not
        # part of the services/programs substrate under test) so the boot is
        # controlled. `--repack-only` makes the removal stick: a normal repack
        # re-mirrors rootfs, which would restore terminal.svc. ktest swaps the
        # bundle's `init` entry via `cargo xtask mkdisk --harness ktest`,
        # which repacks the disk image with the ktest bundle.
        # `mkdisk --svctest` also stages the test-only device class files of
        # `sysroot/config/devmgr/tests/` into `classes/`, and its boots attach
        # the test devices (`--test-devices`, below) the test-only drivers bind.
        # The `burn-in` set co-stages memhog (memhog.svc), which svctest's
        # oom_policy phase has fill memory until oomd stops it. The cell keeps
        # crashd, which build-test.yml's svctest cells drop, so the phase's
        # child writes the pages of a demand region once oomd has stopped every
        # program, spending the pages the last stop freed; crashd holds the
        # write memmgr declines and resumes it when oomd's stop of memhog, a
        # cooldown later and inside crashd's stall, frees memory
        # (services/crashd/docs/operation.md § Hold). It also co-stages
        # stopsrc (stopsrc.svc), a stop source of the program class, whose job
        # oomd stops first and whose source svcmgr lists. It also co-stages
        # reserve-creator (reserve-creator.svc), svctest's fixture for a reserve
        # creator's create while memory is critical.
        # The usertest cell also stages crashd's test recipe over the default
        # one: its `CORE_DUMP` names crashme, whose tester checks the cores.
        # Unlike build-test.yml's, the usertest and ktest images keep the
        # repository's log levels and stage no bootloader knob, so the boot
        # burned in is the default one.
        run: |
          case "${{ matrix.tester }}" in
            svctest)
              rm -f sysroot/config/svcmgr/services/terminal.svc
              cargo xtask mkdisk --arch ${{ matrix.arch }} --repack-only \
                --svctest burn-in
              ;;
            usertest)
              cp sysroot/config/svcmgr/tests/usertest.svc \
                 sysroot/config/svcmgr/tests/crashd.svc \
                 sysroot/config/svcmgr/services/
              rm -f sysroot/config/svcmgr/services/terminal.svc
              cargo xtask mkdisk --arch ${{ matrix.arch }} --repack-only
              ;;
            ktest)
              cargo xtask mkdisk --arch ${{ matrix.arch }} --harness ktest
              ;;
          esac

      - name: Burn in ${{ matrix.tester }} (20 iterations, 2 parallel)
        # Per-cell boot budget, for HANG classification, derived as
        # docs/build-system.md § Continuous Integration states from each
        # cell's worst pass over the 20 2-way runs of burn-in run
        # 44345038387 (2026-11-19, the boot image of master 151fedff5's
        # tree, every budget raised to 1800 s for the run); the worst passes
        # are beside the values. The svctest cells' worsts are over their
        # passes alone, which svctest's oom_policy failures (#1292) thinned
        # to 5 (riscv64 debug), 9 (riscv64 release), 10 (x86_64 debug) and 8
        # (x86_64 release) of 20.
        run: |
          case "${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}" in
            riscv64-debug-svctest)    budget=840 ;;  # worst pass 278.3 s
            riscv64-debug-usertest)   budget=360 ;;  # worst pass 114.1 s
            riscv64-debug-ktest)      budget=480 ;;  # worst pass 140.8 s
            riscv64-release-svctest)  budget=540 ;;  # worst pass 174.2 s
            riscv64-release-usertest) budget=240 ;;  # worst pass 74.2 s
            riscv64-release-ktest)    budget=300 ;;  # worst pass 83.0 s
            x86_64-debug-svctest)     budget=420 ;;  # worst pass 129.5 s
            x86_64-debug-usertest)    budget=240 ;;  # worst pass 76.3 s
            x86_64-debug-ktest)       budget=420 ;;  # worst pass 127.0 s
            x86_64-release-svctest)   budget=480 ;;  # worst pass 144.7 s
            x86_64-release-usertest)  budget=180 ;;  # worst pass 48.5 s
            x86_64-release-ktest)     budget=420 ;;  # worst pass 121.6 s
            *) echo "no budget for this cell" >&2; exit 1 ;;
          esac
          # The svctest boots attach the test devices its devmgr phases drive.
          test_devices=
          if [ "${{ matrix.tester }}" = "svctest" ]; then
            test_devices=--test-devices
          fi
          # The ktest boots fail on a SKIP line, as the validate job's ktest
          # boot does (docs/testing.md § Gating).
          checks=()
          if [ "${{ matrix.tester }}" = "ktest" ]; then
            checks=(--fail-also ' SKIP ')
          fi
          cargo xtask run \
            --arch ${{ matrix.arch }} \
            --parallel 2 --runs 20 --timeout "$budget" $test_devices \
            "${checks[@]}"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: burnin-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.tester }}
          path: |
            target/xtask/run/**/*.log
            target/xtask/run/**/*.crash.txt
          if-no-files-found: ignore

  kani:
    # Every bounded proof, with the Kani release xtask pins (docs/testing.md
    # § Bounded verification), as build-test.yml's kani job runs the crates a
    # change can affect. Installing the release and its setup take seconds,
    # so nothing of Kani is cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kani

      # Installed outside the checkout, so the repository's
      # rust-toolchain.toml does not choose the compiler that builds Kani;
      # `cargo kani setup` installs the nightly Kani builds with.
      - name: Install the pinned Kani release
        run: |
          version=$(cargo xtask kani --pin)
          cd "$RUNNER_TEMP"
          cargo install --locked kani-verifier --version "$version"
          cargo kani setup

      - name: cargo xtask kani
        run: cargo xtask kani
