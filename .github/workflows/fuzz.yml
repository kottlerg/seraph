# .github/workflows/fuzz.yml

# The campaign fuzz tier: every target for a fixed time from a seed that
# changes each run, one job per target side by side, on a manual dispatch
# (docs/testing.md § Fuzzing). This workflow's cache carries each target's
# working corpus only between runs made within the cache's lifetime, so a
# run may start from the checked-in inputs alone; what lasts is in the
# tree, each target's seeds and regressions. It gates no merge; the run the release host runs dispatch gates the tag. A
# failing input it finds is uploaded, and its fix lands with the minimized
# input under the target's regressions/.

name: fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds each target runs
        default: '1800'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  targets:
    # The targets, one matrix entry each.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10

      - name: List the targets
        id: list
        run: |
          targets=$(cargo xtask fuzz --list | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  campaign:
    # One job per target, side by side, each for the dispatch's time: its
    # timeout is that time's default with room for the build and the
    # minimization, so a dispatch keeps its time under about 45 minutes.
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src,rustfmt,clippy,llvm-tools

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-campaign

      # Each run saves the target's corpus under a new key and restores the
      # newest earlier one the cache still holds; with none, the run starts
      # from the checked-in inputs alone.
      - name: Restore the working corpus
        uses: actions/cache@v6
        with:
          path: target/xtask/fuzz/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: cargo xtask fuzz ${{ matrix.target }}
        run: >-
          cargo xtask fuzz ${{ matrix.target }}
          --time ${{ inputs.seconds || '1800' }}
          --seed ${{ github.run_number }}

      - name: Minimize the working corpus
        if: success()
        run: cargo xtask fuzz ${{ matrix.target }} --minimize

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ github.run_number }}-${{ matrix.target }}
          path: target/xtask/fuzz/${{ matrix.target }}/crashes/
          if-no-files-found: ignore
