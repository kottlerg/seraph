# .github/workflows/kani.yml

# The bounded proofs (docs/testing.md § Bounded verification), as the jobs
# build-test.yml and burnin.yml call: a plan of the jobs the run owes, one
# job for each crate it verifies, or for each shard of a crate xtask splits,
# and kani-result, which judges them. The caller's concurrency group applies,
# so a pull request's newer push cancels these jobs with the rest of its
# older run (docs/conventions.md § CI Gating).

name: kani

on:
  workflow_call:
    inputs:
      since:
        description: >-
          The commit the plan selects the affected proof crates from; empty
          proves every crate
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    # The jobs the run owes (`cargo xtask kani --plan`, xtask/README.md): a
    # crate the selection does not pick has none, so the matrix holds no
    # skipped entry.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      owed: ${{ steps.plan.outputs.owed }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The selection diffs against the base commit, which a depth of 1
          # leaves out.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: select

      - name: Plan the jobs
        id: plan
        shell: bash
        env:
          SINCE: ${{ inputs.since }}
        run: |
          since=()
          if [ -n "$SINCE" ]; then
            since=(--since "$SINCE")
          fi
          cargo xtask kani --plan "${since[@]}" --github-output "$GITHUB_OUTPUT" 2>&1 \
            | tee "$RUNNER_TEMP/plan.log"
          { echo '```'; cat "$RUNNER_TEMP/plan.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qx 'owed=false' "$GITHUB_OUTPUT"; then
            echo "::notice title=kani::no proof crate affected"
          fi

  prove:
    # One crate, or one shard of it, with the Kani release xtask pins
    # (docs/build-system.md § Toolchain). Installing the release and its
    # setup take about 10 s, so nothing of Kani is cached. The largest job's
    # harnesses measured about 10 minutes, and no harness runs past xtask's
    # 600 s limit, so 40 minutes is a backstop (docs/testing.md § Bounded
    # verification). Run only when the plan owes a job, since a job of an
    # empty matrix fails.
    needs: plan
    if: needs.plan.outputs.owed == 'true'
    name: prove (${{ matrix.package }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kani

      # Installed outside the checkout, so the repository's
      # rust-toolchain.toml does not choose the compiler that builds Kani;
      # `cargo kani setup` installs the nightly Kani builds with.
      - name: Install the pinned Kani release
        run: |
          version=$(cargo xtask kani --pin)
          cd "$RUNNER_TEMP"
          cargo install --locked kani-verifier --version "$version"
          cargo kani setup

      - name: cargo xtask kani (${{ matrix.package }} ${{ matrix.shard }})
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
        run: cargo xtask kani --component "$PACKAGE" --shard "$SHARD"

  result:
    # The one Kani job of every run, whatever the plan owes, so it can be a
    # required check where a matrix job, which runs only when owed, cannot:
    # it fails when the plan failed, or a prove job failed, ran past its
    # harness limit or its timeout, or was cancelled, or the prove jobs were
    # skipped although the plan owed them.
    name: kani-result
    needs: [plan, prove]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Judge the jobs
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          PROVE: ${{ needs.prove.result }}
          OWED: ${{ needs.plan.outputs.owed }}
        run: |
          if [ "$PLAN" = success ] && { [ "$PROVE" = success ] ||
             { [ "$PROVE" = skipped ] && [ "$OWED" = false ]; }; }; then
            echo "plan: $PLAN, prove: $PROVE (owed: $OWED)"
          else
            echo "::error title=kani-result::plan: $PLAN, prove: $PROVE (owed: $OWED)"
            exit 1
          fi
