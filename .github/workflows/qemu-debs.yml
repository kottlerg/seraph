# .github/workflows/qemu-debs.yml

# Seeds the QEMU and firmware package cache the boot jobs install from.

name: qemu-debs

# Called by build-test.yml and burnin.yml; see docs/build-system.md
# § Continuous Integration.
on:
  workflow_call:

jobs:
  qemu-debs:
    # The booting jobs' runner label; see docs/build-system.md
    # § Continuous Integration.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Seed the QEMU and firmware package entries
        uses: ./.github/actions/qemu-packages
        with:
          mode: cache
