    "services/drivers/iommu/riscv",
    "services/drivers/iommu/store",
    "services/drivers/iommu/vtd",
    "services/drivers/serial",
    "services/drivers/test-dma",
    "services/drivers/test-fault",
    "services/drivers/test-orphan",
    "services/drivers/virtio/core",
    "services/drivers/virtio/blk",
    "services/drivers/virtio/input",
    "services/drivers/virtio/console",
    "services/debug-echo",
    "services/gdbstub",
    "services/fs/fat",
    "services/fs/fat/fat-parse",
    "abi/boot-protocol",
    "abi/init-protocol",
    "abi/process-abi",
    "abi/syscall",
    "shared/ansi",
    "shared/crash-report",
    "shared/crypto",
    "shared/death-set",
    "shared/driver-binding",
    "shared/elf",
    "shared/font",
    "shared/mmio",
    "shared/namespace-protocol",
    "shared/process-layout",
    "shared/syscall",
    "shared/ipc",
    "shared/log",
    "shared/ns-client",
    "shared/registry",
    "shared/registry-client",
    "shared/gdb-rsp",
    "shared/riscv-step",
    "shared/shmem",
