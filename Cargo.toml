[workspace.dependencies]
ansi = { path = "shared/ansi" }
boot-protocol = { path = "abi/boot-protocol" }
elf = { path = "shared/elf" }
init-protocol = { path = "abi/init-protocol" }
process-abi = { path = "abi/process-abi" }
process-layout = { path = "shared/process-layout" }
font = { path = "shared/font" }
mmio = { path = "shared/mmio" }
text = { path = "shared/text" }
syscall = { path = "abi/syscall", package = "syscall-abi" }

# opt-level = 2 and debug = 0 are unified across dev and release; debuginfo
# is opt-in per-package via `cargo xtask build --debug <comp>`. dev and
# release differ only in {debug-assertions, overflow-checks} (iterate) and
# {lto, codegen-units} (ship). LTO has no per-package form, so two profiles
# must persist. A third, fuzz, builds only the fuzz targets.
[profile.dev]
panic = "abort"
opt-level = 2
debug = 0
debug-assertions = true
overflow-checks = true

[profile.release]
panic = "abort"
opt-level = 2
debug = 0
lto = true
codegen-units = 1

# The fuzz targets' profile (`cargo xtask fuzz`): release code with the checks
# a fuzz run reports through. The engine catches a panic in-process, so
# panics unwind; debug assertions and overflow checks turn a silent defect
# into a panic; line tables give its backtrace. LTO is off: the
# SanitizerCoverage pass runs again over the merged module of an LTO build,
# which would instrument the engine's own callbacks.
[profile.fuzz]
inherits = "release"
panic = "unwind"
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
lto = false
