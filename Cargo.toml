# default-members limits bare `cargo build`/`cargo run` to xtask only.
# Components targeting custom/embedded targets are built via `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.5"
edition = "2024"
publish = false


[workspace.lints.rust]
# `cargo kani` sets `cfg(kani)` (docs/testing.md § Bounded verification), and
# `cargo xtask fuzz` alone sets `fuzzing`: the property modules of the parser
# crates and the fuzz targets compile under it (docs/testing.md § Fuzzing).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(fuzzing)'] }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

undocumented_unsafe_blocks       = "warn"
cast_ptr_alignment               = "warn"
unwrap_used                      = "deny"
expect_used                      = "deny"

# restriction lints
allow_attributes                    = "warn"
allow_attributes_without_reason     = "warn"
arithmetic_side_effects             = "warn"
as_pointer_underscore               = "warn"
as_underscore                       = "warn"
assertions_on_result_states         = "warn"
dbg_macro                           = "warn"
default_union_representation        = "warn"
empty_enum_variants_with_brackets   = "warn"
empty_structs_with_brackets         = "warn"
fn_to_numeric_cast_any              = "warn"
get_unwrap                          = "warn"
indexing_slicing                    = "warn"
infinite_loop                       = "warn"
inline_asm_x86_att_syntax           = "warn"
iter_over_hash_type                 = "warn"
mem_forget                          = "warn"
mixed_read_write_in_expression      = "warn"
multiple_unsafe_ops_per_block       = "warn"
panic                               = "warn"
panic_in_result_fn                  = "warn"
pointer_format                      = "warn"
precedence_bits                     = "warn"
pub_without_shorthand               = "warn"
renamed_function_params             = "warn"
rest_pat_in_fully_bound_structs     = "warn"
self_named_module_files             = "warn"
separated_literal_suffix            = "warn"
string_slice                        = "warn"
suspicious_xor_used_as_pow          = "warn"
tests_outside_test_module           = "warn"
todo                                = "warn"
try_err                             = "warn"
unimplemented                       = "warn"
unnecessary_rest_pattern            = "warn"
unnecessary_safety_comment          = "warn"
unnecessary_safety_doc              = "warn"
unnecessary_self_imports            = "warn"
unneeded_field_pattern              = "warn"
unreachable                         = "warn"
unwrap_in_result                    = "warn"
wildcard_enum_match_arm             = "warn"

# nursery lints
as_ptr_cast_mut                     = "warn"
collection_is_never_read            = "warn"
debug_assert_with_mut_call          = "warn"
fallible_impl_from                  = "warn"
large_stack_frames                  = "warn"
literal_string_with_formatting_args = "warn"
non_send_fields_in_send_ty          = "warn"
read_zero_byte_vec                  = "warn"
significant_drop_in_scrutinee       = "warn"
significant_drop_tightening         = "warn"
trailing_empty_array                = "warn"
transmute_undefined_repr            = "warn"
uninhabited_references              = "warn"
