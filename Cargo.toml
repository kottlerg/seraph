    "services/svcmgr/endowment",
    "services/svctest",
    "services/usertest",
    "services/crasher",
    "services/crashd",
    "services/crashd/fault-bound",
    "services/devmgr",
    "services/devmgr/firmware",
    "services/logd",
    "services/logd/codec",
    "services/pwrmgr",
    "services/pwrmgr/acpi",
    "services/timed",
    "services/vfsd",
    "services/vfsd/gpt",
    "services/vfsd/root-backend",
