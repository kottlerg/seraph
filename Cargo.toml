    "programs/demandpaged",
    "programs/capexhaust",
    "programs/crashme",
    "programs/crashme/tester",
    "programs/fb-charset",
    "programs/deadline",
    "programs/deadline/tester",
    "programs/debugger",
    "programs/debugger/tester",
    "programs/fsbench",
    "programs/hello",
    "programs/hello/tester",
    "programs/pipefault",
    "programs/pipestress",
    "programs/pipestress/tester",
    "programs/shell",
    "programs/shell/path",
    "programs/shell/tester",
    "programs/stackoverflow",
    "programs/relrofault",
    "programs/stdiotest",
    "programs/stdiotest/tester",
    "programs/terminal",
    "programs/threadchurn",
    "programs/threadchurn/tester",
    "programs/threadstack",
    "programs/threadstack/tester",
    "runtime/ruststd/argv-env",
    "runtime/ruststd/death-queues",
