# default-members limits bare `cargo build`/`cargo run` to xtask only.
# Components targeting custom/embedded targets are built via `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.3"
edition = "2024"
publish = false


[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

undocumented_unsafe_blocks       = "warn"
cast_ptr_alignment               = "warn"
unwrap_used                      = "deny"
expect_used                      = "deny"

# restriction lints
as_pointer_underscore               = "warn"
as_underscore                       = "warn"
assertions_on_result_states         = "warn"
dbg_macro                           = "warn"
default_union_representation        = "warn"
empty_enum_variants_with_brackets   = "warn"
empty_structs_with_brackets         = "warn"
fn_to_numeric_cast_any              = "warn"
get_unwrap                          = "warn"
infinite_loop                       = "warn"
iter_over_hash_type                 = "warn"
mem_forget                          = "warn"
mixed_read_write_in_expression      = "warn"
precedence_bits                     = "warn"
pub_without_shorthand               = "warn"
renamed_function_params             = "warn"
rest_pat_in_fully_bound_structs     = "warn"
self_named_module_files             = "warn"
separated_literal_suffix            = "warn"
suspicious_xor_used_as_pow          = "warn"
todo                                = "warn"
try_err                             = "warn"
unimplemented                       = "warn"
unnecessary_rest_pattern            = "warn"
unnecessary_safety_comment          = "warn"
unnecessary_safety_doc              = "warn"
unnecessary_self_imports            = "warn"
unneeded_field_pattern              = "warn"

# nursery lints
as_ptr_cast_mut                     = "warn"
collection_is_never_read            = "warn"
debug_assert_with_mut_call          = "warn"
fallible_impl_from                  = "warn"
literal_string_with_formatting_args = "warn"
read_zero_byte_vec                  = "warn"
significant_drop_in_scrutinee       = "warn"
trailing_empty_array                = "warn"
transmute_undefined_repr            = "warn"
uninhabited_references              = "warn"

[workspace.dependencies]
ansi = { path = "shared/ansi" }
boot-protocol = { path = "abi/boot-protocol" }
elf = { path = "shared/elf" }
init-protocol = { path = "abi/init-protocol" }
process-abi = { path = "abi/process-abi" }
process-layout = { path = "shared/process-layout" }
font = { path = "shared/font" }
mmio = { path = "shared/mmio" }
text = { path = "shared/text" }
syscall = { path = "abi/syscall", package = "syscall-abi" }

# opt-level = 2 and debug = 0 are unified across both profiles; debuginfo is
# opt-in per-package via `cargo xtask build --debug <comp>`. dev and release
# differ only in {debug-assertions, overflow-checks} (iterate) and
# {lto, codegen-units} (ship). LTO has no per-package form, so two profiles
# must persist.
[profile.dev]
panic = "abort"
opt-level = 2
debug = 0
debug-assertions = true
overflow-checks = true

[profile.release]
panic = "abort"
opt-level = 2
debug = 0
lto = true
codegen-units = 1
