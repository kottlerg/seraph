[package]
name = "kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
boot-protocol = { workspace = true }
# The Keccak-f[1600] permutation of the entropy sponge. No feature: the kernel
# links no signing code (shared/crypto/README.md § Design notes).
crypto = { path = "../../shared/crypto" }
elf = { workspace = true }
init-protocol = { workspace = true }
# The portable events, the PMU syscalls' register packing and the per-vendor
# counter decode; without the `client` feature, which is the user API.
pmu = { path = "../../shared/pmu" }
process-layout = { workspace = true }
font = { workspace = true }
syscall = { workspace = true }
text = { workspace = true }

# Only the riscv64 interrupt controller (`arch/riscv64/aia.rs`) orders its MMIO
# through `mmio`. The host tests compile that module out, so the dependency is
# the bare-metal kernel's alone (`target_os = "none"`, the kernel targets').
[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
mmio = { workspace = true }

[[bin]]
name = "kernel"
path = "src/main.rs"

[lints]
workspace = true
