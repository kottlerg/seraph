
[package]
name = "ktest"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ktest"
path = "src/main.rs"
test = false

[dependencies]
bench          = { path = "../../shared/bench" }
boot-protocol  = { path = "../../abi/boot-protocol" }
crypto         = { path = "../../shared/crypto" }
font           = { workspace = true }
init-protocol  = { path = "../../abi/init-protocol" }
ipc            = { path = "../../shared/ipc" }
process-layout = { workspace = true }
riscv-step     = { path = "../../shared/riscv-step" }
syscall        = { path = "../../shared/syscall" }
syscall-abi    = { path = "../../abi/syscall" }
text           = { workspace = true }

[features]
# Builds `KtestConfig::BENCH` in place of `KtestConfig::DEFAULT`: the benchmark
# tier alone, at its full iteration count (`cargo xtask build --ktest-bench-only`).
bench-only = []

[lints]
workspace = true
