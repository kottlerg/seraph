#
# The boot-time policy (docs/signing.md § Configuration): the settings by
# which this system's signed configuration makes hardware a boot
# requirement. The format and every key are in shared/boot-policy/README.md.
#
# Every bundle carries this file in the configuration role, and the
# bootloader refuses a bundle without it. A consumer handed no policy, or
# one it does not accept, puts every requirement on. Each key below is
# written out at its default, which a missing line also gives.
#
# `required` starts no DMA-capable driver for a device no IOMMU unit
# confines (docs/device-management.md § DMA Safety Model).
dma-confinement = opportunistic
