[package]
name = "ruststd-heap-fit"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Dual-mode: a host-tested workspace member AND a `rustc-dep-of-std`
# dependency of the seraph std overlay. Holds the pure placement rule of the
# overlay's byte heap (`runtime/ruststd/src/sys/alloc/seraph.rs`): where a
# request lands in a free block and which parts of the block stay free. The
# free-list surgery stays with the caller, so the only dep is the build-std
# core facade, activated under the `rustc-dep-of-std` feature.
[lib]
test = true
doctest = false

[dependencies]
# When std lists this crate as a dep, build-std activates
# `rustc-dep-of-std`, so `use core::…` resolves against the build-std
# core facade. Same pattern as runtime/ruststd/argv-env.
rustc-std-workspace-core = { version = "1.0.1", optional = true }

[features]
rustc-dep-of-std = ["rustc-std-workspace-core"]

[lints]
workspace = true
