[package]
name = "crashd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "crashd"
path = "src/main.rs"
test = false

[dependencies]
# The core file's layout, notes, policy and directory, host-tested there.
core-file = { package = "crashd-core-file", path = "core-file" }
# The report block's emitter and the stack walk, host-tested there.
crash-report = { path = "../../shared/crash-report" }
ipc = { path = "../../shared/ipc" }
# Which faults crashd holds for want of memory, and how each hold ends,
# host-tested there.
oom-hold = { package = "crashd-oom-hold", path = "oom-hold" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
