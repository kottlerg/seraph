[package]
name = "devmgr"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "devmgr"
path = "src/main.rs"
test = false

[dependencies]
boot-protocol = { path = "../../abi/boot-protocol" }
# ACPI / DTB table parsers, extracted so they are host-testable.
firmware = { path = "firmware", package = "devmgr-firmware" }
ipc = { path = "../../shared/ipc" }
namespace-protocol = { path = "../../shared/namespace-protocol" }
ns-client = { path = "../../shared/ns-client" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }
virtio-core = { path = "../drivers/virtio/core" }

[lints]
workspace = true
