[package]
name = "devmgr-firmware"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The AML encodings and the resource-template decoder the static namespace
# walk and the `_CRS` adapter are built on (its alloc-free modules only).
aml = { path = "../../../shared/aml" }
# `VirtioPciStartupInfo`, filled in by the configuration-space walk.
virtio-core = { path = "../../drivers/virtio/core" }
# The decoded driver declaration the match table compares and the class
# name the class table keys on.
driver-binding = { path = "../../../shared/driver-binding" }
# The `DMA_MAP` access bits the DMA table checks.
ipc = { path = "../../../shared/ipc" }
# The line grammar of the platform description table, shared with svcmgr's
# `.svc` and class file parsers.
svc-grammar = { path = "../../../shared/svc-grammar" }
# The `SYS_IRQ_REGISTER` mode bits a MADT override maps to.
syscall-abi = { path = "../../../abi/syscall" }

[lints]
workspace = true
