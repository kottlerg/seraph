[package]
name = "cmos-rtc"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable logic (bins are test = false).
[lib]
name = "cmos_rtc"
path = "src/lib.rs"

[[bin]]
name = "cmos-rtc"
path = "src/main.rs"
test = false

# The binary alone uses these, and it builds for the Seraph targets only, so the
# host-tested library does not pull them into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
# The binary's declaration note (`driver_declaration!`).
driver-binding = { path = "../../../shared/driver-binding" }
ipc = { path = "../../../shared/ipc" }
syscall = { path = "../../../shared/syscall" }
syscall-abi = { path = "../../../abi/syscall" }

[lints]
workspace = true
