[package]
name = "framebuffer"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable logic (bins are test = false).
[lib]
name = "framebuffer"
path = "src/lib.rs"

[[bin]]
name = "framebuffer"
path = "src/main.rs"
test = false

[dependencies]
boot-protocol = { path = "../../../abi/boot-protocol" }
font = { path = "../../../shared/font" }
ipc = { path = "../../../shared/ipc" }
syscall = { path = "../../../shared/syscall" }
syscall-abi = { path = "../../../abi/syscall" }

# The binary alone uses `text`, and it builds for the Seraph targets only, so
# the host-tested library does not pull it into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
# The binary's declaration note (`driver_declaration!`).
driver-binding = { path = "../../../shared/driver-binding" }
text = { path = "../../../shared/text" }

[lints]
workspace = true
