[package]
name = "iommu-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Family-independent logic every IOMMU driver shares (host-tested).
[lib]
name = "iommu_core"
path = "src/lib.rs"

[dependencies]
# The resource list devmgr delivers the driver, its IOMMU units and their
# scope encoding.
driver-binding = { path = "../../../../shared/driver-binding" }
ipc = { path = "../../../../shared/ipc" }
syscall = { path = "../../../../shared/syscall" }
syscall-abi = { path = "../../../../abi/syscall" }

[lints]
workspace = true
