[package]
name = "iommu-riscv"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable register, command, and table encodings (bins are test = false).
[lib]
name = "iommu_riscv"
path = "src/lib.rs"

[[bin]]
name = "iommu-riscv"
path = "src/main.rs"
test = false

[dependencies]
iommu-core = { path = "../core" }
ipc = { path = "../../../../shared/ipc" }
syscall = { path = "../../../../shared/syscall" }
syscall-abi = { path = "../../../../abi/syscall" }

# The binary's page store and its MMIO access build for the Seraph targets only,
# so the host-tested library does not pull them into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
# The binary's declaration note (`driver_declaration!`).
driver-binding = { path = "../../../../shared/driver-binding" }
iommu-store = { path = "../store" }
mmio = { path = "../../../../shared/mmio" }

[lints]
workspace = true
