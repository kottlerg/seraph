[package]
name = "iommu-riscv"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable register, command, and table encodings (bins are test = false).
[lib]
name = "iommu_riscv"
path = "src/lib.rs"

[[bin]]
name = "iommu-riscv"
path = "src/main.rs"
test = false

[dependencies]
iommu-core = { path = "../core" }
ipc = { path = "../../../../shared/ipc" }
mmio = { path = "../../../../shared/mmio" }
syscall = { path = "../../../../shared/syscall" }
syscall-abi = { path = "../../../../abi/syscall" }

# The binary's page store builds for the Seraph targets only, so the
# host-tested library does not pull it into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
iommu-store = { path = "../store" }

[lints]
workspace = true
