[package]
name = "iommu-store"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The table-page store every IOMMU driver binary builds its translation
# structures in. It calls memmgr and maps pages through the Seraph std
# runtime, so it builds for the Seraph targets only, as a dependency of the
# driver binaries, and has no host tests (each family's library host-tests its
# walks over an iommu_core::TableStore of heap pages).
[lib]
name = "iommu_store"
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
iommu-core = { path = "../core" }
ipc = { path = "../../../../shared/ipc" }
syscall = { path = "../../../../shared/syscall" }
syscall-abi = { path = "../../../../abi/syscall" }

[lints]
workspace = true
