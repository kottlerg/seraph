# TODO(#165): remove with the devmgr enumeration redesign. Test-only driver
# for QEMU's `edu` DMA device, so svctest can check that a mapped transfer
# arrives and that the IOMMU stops one at a withdrawn device address.
[package]
name = "test-dma"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "test-dma"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../../shared/ipc" }
syscall = { path = "../../../shared/syscall" }
syscall-abi = { path = "../../../abi/syscall" }
virtio-core = { path = "../virtio/core" }

[lints]
workspace = true
