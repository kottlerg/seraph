# Test-only driver for QEMU's `edu` DMA device, so svctest can check that a
# mapped transfer arrives and that the IOMMU stops one at a withdrawn device
# address.
[package]
name = "test-dma"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "test-dma"
path = "src/main.rs"
test = false

[dependencies]
# The driver's declaration note and the resource list devmgr delivers it.
driver-binding = { path = "../../../shared/driver-binding" }
ipc = { path = "../../../shared/ipc" }
syscall = { path = "../../../shared/syscall" }
syscall-abi = { path = "../../../abi/syscall" }
# The DMA capability's `DMA_MAP` and `DMA_UNMAP` calls.
virtio-core = { path = "../virtio/core" }

[lints]
workspace = true
