[package]
name = "virtio-blk"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable request logic (bins are test = false).
[lib]
name = "virtio_blk"
path = "src/lib.rs"

[[bin]]
name = "virtio-blk"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../../../shared/ipc" }
syscall = { path = "../../../../shared/syscall" }
syscall-abi = { path = "../../../../abi/syscall" }

# The binary alone uses `virtio-core`, and it builds for the Seraph targets only, so
# the host-tested library does not pull it into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
virtio-core = { path = "../core" }

[lints]
workspace = true
