[package]
name = "virtio-rng"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable gate and length logic (bins are test = false).
[lib]
name = "virtio_rng"
path = "src/lib.rs"

[[bin]]
name = "virtio-rng"
path = "src/main.rs"
test = false

[dependencies]
hwrng-protocol = { path = "../../../../shared/hwrng-protocol" }

# The binary alone uses these, and it builds for the Seraph targets only, so
# the host-tested library does not pull them into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
# The binary's declaration note (`driver_declaration!`).
driver-binding = { path = "../../../../shared/driver-binding" }
ipc = { path = "../../../../shared/ipc" }
syscall = { path = "../../../../shared/syscall" }
syscall-abi = { path = "../../../../abi/syscall" }
virtio-core = { path = "../core" }

[lints]
workspace = true
