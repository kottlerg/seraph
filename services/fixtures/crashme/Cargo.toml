[package]
name = "crashme"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "crashme"
path = "src/main.rs"
test = false

[dependencies]
# `worker` binds a thread's exception class and holds its fault itself.
ipc = { path = "../../../shared/ipc" }
# `oom-fill` fills memmgr's pool up to the system reserve.
mem-fill = { path = "../../../shared/mem-fill" }
syscall = { path = "../../../shared/syscall" }
syscall-abi = { path = "../../../abi/syscall" }

[lints]
workspace = true
