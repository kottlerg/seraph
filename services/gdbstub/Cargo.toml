[package]
name = "gdbstub"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable register map, breakpoint table, stop signals, run-control
# decisions, and the session's stop state machine (bins are test = false).
[lib]
name = "gdbstub"
path = "src/lib.rs"

[[bin]]
name = "gdbstub"
path = "src/main.rs"
test = false

[dependencies]
gdb-rsp = { path = "../../shared/gdb-rsp" }
# procmgr's debugger badge tag, which the library's binding badges carry.
ipc = { path = "../../shared/ipc" }
riscv-step = { path = "../../shared/riscv-step" }
syscall-abi = { path = "../../abi/syscall" }

# The binary alone uses this, and it builds for the Seraph targets only, so the
# host-tested library does not pull it into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
syscall = { path = "../../shared/syscall" }

[lints]
workspace = true
