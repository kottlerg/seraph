[package]
name = "init"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "init"
path = "src/main.rs"
test = false

[dependencies]
init-protocol = { path = "../../abi/init-protocol" }
# init-logd's per-sender slot table, kept host-testable outside this no_std bin.
init-sender-table = { path = "sender-table" }
# The `log-levels` boot module's parser, kept host-testable outside this no_std bin.
init-log-levels = { path = "log-levels" }
# `level_entry`: the `SERAPH_LOG` env entry init hands the services it spawns.
log = { path = "../../shared/log" }
process-abi = { path = "../../abi/process-abi" }
process-layout = { path = "../../shared/process-layout" }
elf = { path = "../../shared/elf" }
ipc = { path = "../../shared/ipc" }
# The init-logd → real-logd handover wire contract (init-logd is its sender).
logd-codec = { path = "../logd/codec" }
namespace-protocol = { path = "../../shared/namespace-protocol" }
ns-client = { path = "../../shared/ns-client" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }
# The init → svcmgr handover endowment wire contract (init encodes it).
svcmgr-endowment = { path = "../svcmgr/endowment" }

[lints]
workspace = true
