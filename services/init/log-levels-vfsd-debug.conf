#
# The log-level configuration the usertest CI cell boots
# (docs/testing.md § Coverage tiers): vfsd at debug, every other service at
# info. The cell packs it with `cargo xtask mkdisk --log-levels` and its boot
# requires a debug line of vfsd and of the fatfs vfsd spawns, and fails on one
# of devmgr or procmgr: a level reaches the service it names and the processes
# that service spawns, and no other (services/init/docs/bootstrap.md
# § Log levels).

vfsd = debug
