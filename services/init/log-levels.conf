#
# Log levels of the services init spawns
# (services/init/docs/bootstrap.md § Log levels).
#
# One setting per line: `<service> = <level>`. The services are procmgr,
# devmgr, vfsd and svcmgr; the levels are error, warn, info, debug and trace.
# A service with no setting logs at info. A driver devmgr spawns and a
# filesystem driver vfsd spawns log at their spawner's level.
#
# `cargo xtask compose-bundle` packs this file into the boot bundle, so an
# edit takes effect at the next compose, with no rebuild.
#
# vfsd = debug
