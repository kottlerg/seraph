#
# Log levels of the services init spawns
# (services/init/docs/bootstrap.md § Log levels).
#
# One setting per line: `<service> = <level>`. The services are procmgr,
# devmgr, vfsd and svcmgr; the levels are the eight RFC 5424 severities,
# emergency, alert, critical, error, warn, notice, info and debug.
# A service with no setting logs at info. A driver devmgr spawns and a
# filesystem driver vfsd spawns log at their spawner's level.
#
# `cargo xtask mkdisk` packs this file into the boot bundle, so an edit
# takes effect at the next mkdisk, with no rebuild; `mkdisk --log-levels FILE`
# packs another file in its place.
#
# vfsd = debug
