[package]
name = "logd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "logd"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../shared/ipc" }
# Pure handover decoding and diagnostic formatting, extracted so it is
# host-testable.
logd-codec = { path = "codec" }
# `MAX_PROCESSES`: the death queue is sized from procmgr's own death queue.
procmgr-process-table = { path = "../procmgr/process-table" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
