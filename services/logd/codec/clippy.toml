# clippy.toml — Clippy settings for the logd-codec crate.
# docs/coding-standards.md § Clippy states the rule each setting serves; this
# file restates every setting of the root clippy.toml, with the frame
# threshold of the stack the crate's code runs on.

# 4096 bytes, a quarter of the smallest stack the crate's code runs on: init
# links it, and init's threads run on 16 KiB (INIT_STACK_PAGES,
# abi/init-protocol/src/lib.rs).
stack-size-threshold = 4096
