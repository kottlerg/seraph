[package]
name = "logd-slot-table"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Pure logic: logd's sender slots, their history under its byte bound, and the
# retired slots. Built against std, as logd is. Host-tested.

[dependencies]
# `log_query` views and codes, `log_record` spans: the stored form logd's
# queries read.
ipc = { path = "../../../shared/ipc" }
# `LINE_BUF_SIZE`, `MAX_NAME_LEN`, the longest entry and the query rows.
logd-codec = { path = "../codec" }

[dev-dependencies]
# The overflow watch of logd's death drain and the model of the kernel's death
# queue, for the death-resync test.
death-set = { path = "../../../shared/death-set", features = ["model"] }

[lints]
workspace = true
