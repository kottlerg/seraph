[package]
name = "memmgr-free-pool"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# PAGE_SIZE is the single source of truth in the syscall ABI; the split-offset
# and demand-chunk arithmetic here works in page units.
syscall-abi = { path = "../../../abi/syscall" }
# A committed region's page-table reservation is built on the bound the std
# runtime tops its own page-table pool up by (`pool_funding::pt_pages_for`).
pool-funding = { path = "../../../runtime/ruststd/pool-funding", package = "ruststd-pool-funding" }
# The swap tier seals each chunk's stream into its swap slot with the in-tree
# ChaCha20-Poly1305 (`spill.rs`).
crypto = { path = "../../../shared/crypto" }

[lints]
workspace = true
