[package]
name = "oomd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "oomd"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../shared/ipc" }
# The configuration, the ladder and the stop order, host-tested there.
policy = { package = "oomd-policy", path = "policy" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
