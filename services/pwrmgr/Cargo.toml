[package]
name = "pwrmgr"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pwrmgr"
path = "src/main.rs"
test = false

[dependencies]
# Pure ACPI FADT/DSDT parser the x86-64 shutdown path hands its mapped
# tables to; the `acpi` key keeps the in-crate path short.
acpi = { path = "acpi", package = "pwrmgr-acpi" }
ipc = { path = "../../shared/ipc" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
