[package]
name = "pwrmgr"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable parts of the core-death power-off: the allocation guard, the
# core-death queue's entries and the register the x86-64 power-off writes
# (bins are test = false).
[lib]
name = "pwrmgr"
path = "src/lib.rs"

[[bin]]
name = "pwrmgr"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../shared/ipc" }

# The binary alone uses these, and it builds for the Seraph targets only, so the
# host-tested library does not pull them into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
