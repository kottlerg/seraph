[package]
name = "svcmgr"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "svcmgr"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../shared/ipc" }
svcmgr-defs = { path = "svc-defs" }
# The windowed restart budget each service is charged (`RestartBudget`).
restart-budget = { path = "../../shared/restart-budget" }
# The death-queue set and main wait set (`DeathSet`).
death-set = { path = "../../shared/death-set" }
# The init → svcmgr handover endowment wire contract (svcmgr decodes it).
svcmgr-endowment = { path = "endowment" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }
registry = { path = "../../shared/registry" }
namespace-protocol = { path = "../../shared/namespace-protocol" }

[lints]
workspace = true
