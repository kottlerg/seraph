[package]
name = "svctest"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "svctest"
path = "src/main.rs"
test = false

[dependencies]
# `EventCounters`: the pmu_authority phase counts a loop through the event
# columns a benchmark reports, with the copy svcmgr delivers.
bench = { path = "../../shared/bench", features = ["pmu"] }
# `InterruptKind`: the devmgr MSI delivery phase matches the interrupt kind
# the test-dma fixture reports holding.
driver-binding = { path = "../../shared/driver-binding" }
# `slot_ceiling` and `QUARANTINE_MAX`: the fs_ipc slot-reuse phase checks
# fatfs's cache bounds against the definitions fatfs uses.
fat_parse = { path = "../fs/fat/fat-parse", package = "fatfs-parse" }
# `validate_executable` and `parse_stack_note`: the layout stack-note phase
# reads svctest's own image with the parser procmgr loads it with.
elf = { path = "../../shared/elf" }
# `commit::grow_need`: the memmgr_swap_commit phase sizes its commitments by
# what memmgr's admission counts for them.
free_pool = { path = "../memmgr/free-pool", package = "memmgr-free-pool" }
# `READ`, its error codes, and `decode_reply`: the drivers phases read the
# entropy driver through the `hwrng` class protocol.
hwrng-protocol = { path = "../../shared/hwrng-protocol" }
ipc = { path = "../../shared/ipc" }
# The fixture record of svctest's staged recipe, and the fixtures it names:
# svctest refuses a run whose image does not stage exactly the declared set.
svctest-fixtures = { path = "fixtures" }
# `TICK_MS`: the logd_reserve phase's creates wait out memhog's take-back of
# the pages a destroy freed.
mem-fill = { path = "../../shared/mem-fill" }
# `SINK_STALL_MS`: the logd_sinks phase bounds its calls and its waits by
# logd's stall bound. `text_holds`: the logd_flood phase reads which sinks
# `SINK_LIST` reports as holding senders back.
logd-codec = { path = "../logd/codec" }
# `HOLD_WINDOW` and the history bounds: the logd_sinks phase sends lines past
# svctest's hold window and past its share of logd's history, and the
# logd_flood phase's probe keeps within that window.
logd-slot-table = { path = "../logd/slot-table" }
# `write_bytes` and the log-call bounds: the log_client phase logs to an
# endpoint of its own that never answers, through this copy of the crate, so
# std's copy and svctest's real log stream are untouched.
log = { path = "../../shared/log" }
namespace-protocol = { path = "../../shared/namespace-protocol" }
# `Pmu`, `PmuEvent` and `PmuMode`: the pmu_authority phase describes the CPU's
# counters through the copy svcmgr delivers and names the events it opens.
pmu = { path = "../../shared/pmu", features = ["client"] }
# `Config` and its parsers: the oom phase reads oomd's recipe as oomd does.
oomd-policy = { path = "../oomd/policy" }
process-abi = { workspace = true }
process-layout = { path = "../../shared/process-layout" }
# `FIRST_POOL_OBSERVERS`: the death_queue_growth phase sizes its children
# from procmgr's first death-queue pool.
process_table = { path = "../procmgr/process-table", package = "procmgr-process-table" }
# `RecvPool`: the recv_pool phase serves an endpoint of its own through the
# worker pool.
recv-pool = { path = "../../shared/recv-pool" }
# `RESTART_BURST` and `RESTART_WINDOW_NS`: the vfsd_driver_death phase kills
# the /data fs driver once per restart vfsd's budget for the mount allows, and
# once more.
restart-budget = { path = "../../shared/restart-budget" }
# `PATH`: the vfsd phases that mount the data partition away from /data run
# only when no storage statement names it for /data.
storage-statement = { path = "../../shared/storage-statement" }
syscall = { path = "../../shared/syscall" }
# `MSG_DATA_WORDS_MAX`: the `fs_std` rename cell sizes its long leaf names
# so two of them overflow the `FS_RENAME` data area, and the
# `fs_ipc` request-bounds phase sizes the inline FS_READ reply ceiling.
# `SyscallError`: the svcmgr published-send phase matches the code a
# re-badge of the already-badged published cap returns, the memmgr
# retyped-grant phase the code `mem_map` refuses a retyped page with, and the
# fs_faults block server tells an exhausted page-table pool from a bad cap.
# `MSG_CAP_SLOTS_MAX`: the memmgr stray-cap flood attaches a full cap-slot
# set to each message. `FAULT_LABEL`, `FAULT_KIND_EXCEPTION`, and
# `FAULT_REPLY_KILL`: its forged-fault case sends a fault-shaped request
# and expects the KILL reply. `SYS_THREAD_SET_FAULT_HANDLER` and
# `FAULT_CLASS_ALL`: the pager forged-badge phase issues the raw bind.
# `FAULT_KIND_VM`, `FAULT_ACCESS_*`, `FAULT_REPLY_RESUME`, and
# `FAULT_REPLY_FORWARD`: the pager refused-access phase forges VM faults and
# expects RESUME or FORWARD.
# `PAGE_SIZE`: the argv/env refusal cell declares a header one byte past its
# one-page cap, and the verified-read phase counts the copy's pages.
# `SyscallError` also: the pmu_authority phase matches the codes the open of
# the event counters is refused with.
syscall-abi = { path = "../../abi/syscall" }
shmem = { path = "../../shared/shmem" }

[lints]
workspace = true
