[package]
name = "svctest"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "svctest"
path = "src/main.rs"
test = false

[dependencies]
# `slot_ceiling` and `QUARANTINE_MAX`: the fs_ipc slot-reuse phase checks
# fatfs's cache bounds against the definitions fatfs uses.
fat_parse = { path = "../fs/fat/fat-parse", package = "fatfs-parse" }
ipc = { path = "../../shared/ipc" }
namespace-protocol = { path = "../../shared/namespace-protocol" }
process-abi = { workspace = true }
process-layout = { path = "../../shared/process-layout" }
# `FIRST_POOL_OBSERVERS`: the death_queue_growth phase sizes its children
# from procmgr's first death-queue pool.
process_table = { path = "../procmgr/process-table", package = "procmgr-process-table" }
syscall = { path = "../../shared/syscall" }
# `MSG_DATA_WORDS_MAX`: the `fs_std` rename cell sizes its long leaf names
# so two of them overflow the `FS_RENAME` data area, and the
# `fs_ipc` request-bounds phase sizes the inline FS_READ reply ceiling.
# `SyscallError`: the svcmgr published-send phase matches the code a
# re-badge of the already-badged published cap returns, and the memmgr
# retyped-grant phase the code `mem_map` refuses a retyped page with.
# `MSG_CAP_SLOTS_MAX`: the memmgr stray-cap flood attaches a full cap-slot
# set to each message. `FAULT_LABEL`, `FAULT_KIND_EXCEPTION`, and
# `FAULT_REPLY_KILL`: its forged-fault case sends a fault-shaped request
# and expects the KILL reply. `SYS_THREAD_SET_FAULT_HANDLER` and
# `FAULT_CLASS_ALL`: the pager forged-badge phase issues the raw bind.
# `FAULT_KIND_VM`, `FAULT_ACCESS_*`, and `FAULT_REPLY_RESUME`: the pager
# refused-access phase forges VM faults and expects RESUME or KILL.
# `PAGE_SIZE`: the argv/env refusal cell declares a header one byte past its
# one-page cap.
syscall-abi = { path = "../../abi/syscall" }
shmem = { path = "../../shared/shmem" }

[lints]
workspace = true
