[package]
name = "svctest"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "svctest"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../shared/ipc" }
namespace-protocol = { path = "../../shared/namespace-protocol" }
process-abi = { workspace = true }
process-layout = { path = "../../shared/process-layout" }
syscall = { path = "../../shared/syscall" }
# `MSG_DATA_WORDS_MAX`: the blob-size cells size argv/env against the
# `CREATE_FROM_FILE` data area, the `fs_std` rename cell sizes its long
# leaf names so two of them overflow the `FS_RENAME` data area, and the
# `fs_ipc` request-bounds phase sizes the inline FS_READ reply ceiling.
# `SyscallError`: the svcmgr published-send phase matches the code a
# re-badge of the already-badged published cap returns.
# `MSG_CAP_SLOTS_MAX`: the memmgr stray-cap flood attaches a full cap-slot
# set to each message. `FAULT_LABEL`, `FAULT_KIND_EXCEPTION`, and
# `FAULT_REPLY_KILL`: its forged-fault case sends a fault-shaped request
# and expects the KILL reply.
syscall-abi = { path = "../../abi/syscall" }
shmem = { path = "../../shared/shmem" }

[lints]
workspace = true
