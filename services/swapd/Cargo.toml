[package]
name = "swapd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "swapd"
path = "src/main.rs"
test = false

[dependencies]
ipc = { path = "../../shared/ipc" }
# Where a slot lies, the replies to a held fault, and the write-out's moves,
# host-tested there.
layout = { package = "swapd-layout", path = "layout" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
