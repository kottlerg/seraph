[package]
name = "usertest"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-testable declaration of which recipe seeds each tester takes (bins are
# test = false).
[lib]
name = "usertest"
path = "src/lib.rs"

[[bin]]
name = "usertest"
path = "src/main.rs"
test = false

# The binary alone uses these, and it builds for the Seraph targets only, so the
# host-tested library does not pull them into a host build.
[target.'cfg(target_os = "seraph")'.dependencies]
ipc = { path = "../../shared/ipc" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
