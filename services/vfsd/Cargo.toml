[package]
name = "vfsd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "vfsd"
path = "src/main.rs"
test = false

[dependencies]
# Seraph-minted GPT partition type GUIDs (per-arch root and EFI ESP);
# vfsd compares GPT entries against these to identify the rootfs.
boot-protocol = { path = "../../abi/boot-protocol" }
# Pure GPT-format parser; vfsd wraps it with block-device I/O in partition.rs.
# Package is `vfsd-gpt`, which names whose parser it is; the `gpt` dependency
# key keeps the in-crate path short.
gpt = { path = "gpt", package = "vfsd-gpt" }
# Pure host-tested cut-off of a partition grant (revoke, retire, delete).
grant = { path = "grant", package = "vfsd-grant" }
ipc = { path = "../../shared/ipc" }
namespace-protocol = { path = "../../shared/namespace-protocol" }
# The walk to the storage statement.
ns-client = { path = "../../shared/ns-client" }
# Pure host-tested synthetic-root tree (`VfsdRootBackend`); the `root_backend`
# key keeps the in-crate path the module name it replaced.
root_backend = { path = "root-backend", package = "vfsd-root-backend" }
# The storage statement's format (`/config/vfsd/storage.conf`), shared with
# xtask, which stages one.
storage-statement = { path = "../../shared/storage-statement" }
# Pure host-tested swap-partition hand-out (`GET_SWAP_PARTITION`'s decisions).
swap = { path = "swap", package = "vfsd-swap" }
syscall = { path = "../../shared/syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
