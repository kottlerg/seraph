[package]
name = "crash-report"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The normalized exception codes, the fault-message access bits, and the
# register-file sizes the report's field names follow.
syscall-abi = { path = "../../abi/syscall" }

# no_std pure logic: the crash-report block's emitter (crashd) and parser
# (xtask). Host-tested; built for every target that links it.
[lib]
test = true
doctest = false

[lints]
workspace = true
