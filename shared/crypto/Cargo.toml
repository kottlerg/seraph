[package]
name = "crypto"
version.workspace = true
edition.workspace = true
publish.workspace = true

# no_std: vetted hashes (SHA-512, SHAKE on Keccak-f[1600]), Ed25519 and
# ML-DSA-65 signature verification, their key generation and signing behind
# the `sign` feature, and the ChaCha20-Poly1305 AEAD; the kernel's entropy
# sponge runs its Keccak-f[1600], ktest runs its known-answer tests, and
# shared/objsig verifies signed objects with it. Pure core, no external deps.
[lib]
test = true
doctest = false

[features]
# Ed25519 and ML-DSA-65 key generation and signing, for a host tool. No component built for
# the target may enable it, so that no loader compiles signing code (README,
# § Design notes). The crate's own tests compile the signer without it.
sign = []

[dependencies]

[dev-dependencies]
# Host-only test infrastructure: the Wycheproof loader and vectors, and the
# differential harness with its reference implementations.
crypto-testkit = { path = "testkit" }

[lints]
workspace = true
