[package]
name = "crypto-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Test-only: reached as a dev-dependency, never by a shipped binary or by
# xtask. Its references are vectors computed with OpenSSL, which its
# generator binary writes; it depends on no registry crate.
[lib]
doctest = false

[[bin]]
name = "crypto-reference-vectors"
test = false

[dependencies]
# The JSON reader of the Wycheproof files and the reference vectors.
json = { path = "../../json" }

[lints]
workspace = true
