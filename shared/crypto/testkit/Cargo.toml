[package]
name = "crypto-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Test-only: reached as a dev-dependency, never by a shipped binary or by
# xtask. Its dependencies are the host-only references the differential
# harness compares against, and the JSON reader of the Wycheproof loader.
[lib]
doctest = false

[dependencies]
# The Ed25519 reference: an implementation independent of `shared/crypto`,
# whose `verify` is cofactorless like Seraph's verifier.
ed25519-dalek = { version = "3", default-features = false }
# Its point and scalar types: the reference's encoding checks, and the
# edge-case corpus's small-order points and crafted signatures.
curve25519-dalek = { version = "5", default-features = false }
# The SHA-512 reference.
sha2 = { version = "0.11", default-features = false }
# The Wycheproof loader: test files are JSON, read into typed schemas.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
