[package]
name = "device-tracker"
version.workspace = true
edition.workspace = true
publish.workspace = true

# std: a device class's current driver for std clients. Spawns a `std`
# tracker thread and logs through `std::os::seraph`, so its contents compile
# only for seraph; the decision it applies is `ipc::refresh_device`'s,
# host-tested in shared/ipc.
[lib]
test = false
doctest = false

[dependencies]
ipc = { path = "../ipc" }
syscall = { path = "../syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
