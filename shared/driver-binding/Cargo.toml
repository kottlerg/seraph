[package]
name = "driver-binding"
version.workspace = true
edition.workspace = true
publish.workspace = true

# no_std: the driver declaration a driver carries in `.note.seraph.driver`
# and the resource list devmgr delivers it, encoded and decoded once for both
# sides, the driver's decoded list on its heap (`alloc`). Pure logic,
# host-tested.
[lib]
doctest = false

[dependencies]
# `request_round`, `BootstrapRound`, and the positional-slot packing the
# resource list's end round uses.
ipc = { path = "../ipc" }
# The `seraph` note owner and the driver note's type.
process-abi = { path = "../../abi/process-abi" }
# `cap_delete` of the caps a refused resource list delivered.
syscall = { path = "../syscall" }
# `MSG_CAP_SLOTS_MAX`, `MSG_DATA_WORDS_MAX` and the `SYS_IRQ_REGISTER` mode
# mask.
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
