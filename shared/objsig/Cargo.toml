[package]
name = "objsig"
version.workspace = true
edition.workspace = true
publish.workspace = true

# no_std, no allocation: the codec and verifier of Seraph's signed objects,
# certificates and trust store (docs/signing.md). xtask links it, to sign and verify.
[lib]
doctest = false

[features]
# Composite key generation and signing (shared/crypto's `sign`), for a host
# tool. No component built for the target may enable it, so that no loader
# compiles signing code; the crate's own tests compile the signer without it.
sign = ["crypto/sign"]

[dependencies]
crypto = { path = "../crypto" }

[dev-dependencies]
# The tests sign their fixtures with the composite signer.
crypto = { path = "../crypto", features = ["sign"] }
# Host-only: the seeded generator of the robustness tests.
crypto-testkit = { path = "../crypto/testkit" }

[lints]
workspace = true
