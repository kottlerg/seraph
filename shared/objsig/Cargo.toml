[package]
name = "objsig"
version.workspace = true
edition.workspace = true
publish.workspace = true

# no_std, no allocation: the codec and verifier of Seraph's signed objects,
# certificates and trust store (docs/signing.md). xtask links it, to sign and verify.
[lib]
doctest = false

[dependencies]
crypto = { path = "../crypto" }

[dev-dependencies]
# Host-only: the seeded generator of the robustness tests, the hex decoder,
# and the edwards25519 arithmetic the tests' signer is built on.
crypto-testkit = { path = "../crypto/testkit" }

[lints]
workspace = true
