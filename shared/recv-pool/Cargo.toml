[package]
name = "recv-pool"
version.workspace = true
edition.workspace = true
publish.workspace = true

# std: the worker-pool receive helper of multi-threaded std services. Spawns
# `std` threads and reads each one's IPC buffer through `std::os::seraph`, so
# its contents compile only for seraph; it holds no pure logic to host-test.
[lib]
test = false
doctest = false

[dependencies]
ipc = { path = "../ipc" }
syscall = { path = "../syscall" }
syscall-abi = { path = "../../abi/syscall" }

[lints]
workspace = true
