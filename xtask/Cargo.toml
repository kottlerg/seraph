[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true

# xtask builds on the host; std is available.
[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Declarative CLI with auto-generated help text.
clap = { version = "4", features = ["derive"] }
# Ergonomic error propagation with .context().
anyhow = "1"
# Seraph-minted GPT partition type GUIDs are defined here so xtask
# (producer) and vfsd (consumer) reference the same byte arrays.
boot-protocol = { path = "../abi/boot-protocol" }
# `test-debug-port`: the GDB remote serial protocol's framing, shared with the
# guest fixture it drives.
gdb-rsp = { path = "../shared/gdb-rsp" }
gpt = "4"
fatfs = "0.3"
uuid = "1"
# Regex matching for run-parallel pass/fail classification.
regex = "1"
# Portable SIGINT / Ctrl+C handler. Wraps signal(2) on Unix and
# SetConsoleCtrlHandler on Windows behind a single set_handler call.
ctrlc = "3"
# Unix termios / ioctl bindings for TerminalGuard. Used unconditionally
# because libc compiles cleanly on every platform xtask runs on, with
# unused Unix-only items naturally elided on Windows builds.
libc = "0.2"
# Portable PATH-lookup. Used to resolve qemu-system-* and llvm-objcopy
# up-front so missing tools produce a clear error naming the tool and
# pointing at the install package, rather than the OS's opaque
# "No such file or directory" from Command::spawn.
which = "8"
# `symbolize`: ELF parsing (sections, symbol table) and DWARF address-to-line
# resolution, in Rust, so symbolizing needs no host tool the pinned toolchain
# does not ship (its llvm-tools carries no symbolizer).
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
addr2line = { version = "0.27", default-features = false, features = ["std", "rustc-demangle"] }
# `pr-check`, `review-check`, `review-ledger`, `issue-edit`, `issue-file`: the
# GitHub CLI answers in JSON, and the review's run records are JSON files.
serde_json = "1"
# The crash-report block's parser: test-crash-report reads the blocks with
# the crate crashd emits them with, not a copy of their grammar.
crash-report = { path = "../shared/crash-report" }
# logd's reclaim line (`logd_codec::reclaim`): `symbolize --log` reads the
# name it prints for a slot that registered none from it.
logd-codec = { path = "../services/logd/codec" }
# procmgr's thread crash badge (`threads::is_crash_badge`): `symbolize --log`
# tells a block that carries one, which names no process, from a process's.
procmgr-process-table = { path = "../services/procmgr/process-table" }

[dev-dependencies]
# `symbolize`'s tests write their ELF fixtures (a symbol table and DWARF
# with a known function, file, and line) instead of checking binaries in.
object = { version = "0.40", default-features = false, features = ["write"] }
gimli = { version = "0.34", default-features = false, features = ["write"] }
# The normalized exception codes test-crash-report's tests build reports with.
syscall-abi = { path = "../abi/syscall" }

# Windows console-mode bindings for TerminalGuard. Only pulled in for
# Windows builds; Linux/macOS/BSD builds skip this crate entirely.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[lints]
workspace = true
