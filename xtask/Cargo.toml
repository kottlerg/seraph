[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true

# xtask builds on the host; std is available.
[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Seraph-minted GPT partition type GUIDs are defined here so xtask
# (producer) and vfsd (consumer) reference the same byte arrays.
boot-protocol = { path = "../abi/boot-protocol" }
# The boot-time policy's parser: a pack refuses a policy it does not accept.
boot-policy = { path = "../shared/boot-policy" }
# The `debug-port` case: the GDB remote serial protocol's framing, shared with the
# guest fixture it drives.
gdb-rsp = { path = "../shared/gdb-rsp" }
# The FAT encodings mkdisk's volume writer shares with the fatfs service: FAT
# entries, long-name slots and their checksum, and short names' numeric tails.
fat_parse = { path = "../services/fs/fat/fat-parse", package = "fatfs-parse" }
# `pr-check`, `review-ledger`, `issue-edit`, `issue-file`: the
# GitHub CLI answers in JSON, and the review's run records are JSON files.
json = { path = "../shared/json" }
# The crash-report block's parser: xtask's crash_check module, which
# `run --crash-reports` and the `--crash-reports` check both use, reads the blocks with
# the crate crashd emits them with, not a copy of their grammar.
crash-report = { path = "../shared/crash-report" }
# logd's reclaim line (`logd_codec::reclaim`): `symbolize --log` reads the
# name it prints for a slot that registered none from it.
logd-codec = { path = "../services/logd/codec" }
# procmgr's thread crash badge (`threads::is_crash_badge`): `symbolize --log`
# tells a block that carries one, which names no process, from a process's.
procmgr-process-table = { path = "../services/procmgr/process-table" }
# svcmgr's restart budget (`restart_budget::RESTART_BURST`): the `shutdown` case kills
# logd once per restart the budget allows, and once more.
restart-budget = { path = "../shared/restart-budget" }
# The path-account plugin's record format and instruction classes:
# `path-account trace` reads the record the plugin wrote with the crate that
# writes it.
seraph-path-account-plugin = { path = "path-account-plugin" }
# vfsd's GPT parser: the check every pack makes of the images it writes
# (src/image_check.rs) finds each image's partitions through it, and the disk
# tooling's tests read the tables mkdisk writes back through it.
vfsd-gpt = { path = "../services/vfsd/gpt" }
# Signing of the objects a build packs (src/signing, docs/signing.md § Signing):
# the SHA-512 of each body, the composite signer (objsig's `sign`, which
# enables crypto's), and the trailer, certificate and trust-store codec with the
# verifier each signed object is checked against before it is written.
crypto = { path = "../shared/crypto" }
objsig = { path = "../shared/objsig", features = ["sign"] }
# The benchmark result line's parser (`bench::parse_line`): `bench-check` and
# `bench-baseline` read the lines with the crate every benchmark writes them
# with. Without its counters, which exist only on Seraph's architectures.
bench = { path = "../shared/bench", default-features = false }
# init's log-level parser: `mkdisk --log-levels` refuses a configuration with a
# line init would ignore.
init-log-levels = { path = "../services/init/log-levels" }

[dev-dependencies]
# The normalized exception codes crash_check's tests build reports with.
syscall-abi = { path = "../abi/syscall" }
# The `test-fault` fixture's role BAR lengths, which the qemu tests check the
# test launch's `pci-testdev` functions against.
ipc = { path = "../shared/ipc" }

[lints]
workspace = true
