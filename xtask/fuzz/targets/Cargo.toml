# The fuzz targets: one binary each, which hands its crate's property
# function to the engine. `cargo xtask fuzz` builds them instrumented, with
# `--cfg fuzzing`; built any other way, each prints that and exits.
# `cargo xtask fuzz --list` names the binaries of src/bin/ but the planted
# ones, which only `--self-test` runs. A target adds one line to each list
# below, its parser crate's and its binary's, each in name order.
# The binaries, as one array rather than `[[bin]]` tables, so each target is
# one line; a root key, so it comes before the first table.
bin = [
    { name = "boot-firmware", path = "src/bin/boot-firmware.rs", test = false },
    { name = "boot-protocol", path = "src/bin/boot-protocol.rs", test = false },
    { name = "devmgr-firmware", path = "src/bin/devmgr-firmware.rs", test = false },
    { name = "driver-binding", path = "src/bin/driver-binding.rs", test = false },
    { name = "elf", path = "src/bin/elf.rs", test = false },
    { name = "firmware-tables", path = "src/bin/firmware-tables.rs", test = false },
    { name = "gpt", path = "src/bin/gpt.rs", test = false },
    { name = "hwrng-protocol", path = "src/bin/hwrng-protocol.rs", test = false },
    { name = "init-protocol", path = "src/bin/init-protocol.rs", test = false },
    { name = "objsig", path = "src/bin/objsig.rs", test = false },
    { name = "planted-length", path = "src/bin/planted-length.rs", test = false },
    { name = "planted-magic", path = "src/bin/planted-magic.rs", test = false },
    { name = "planted-nested", path = "src/bin/planted-nested.rs", test = false },
    { name = "storage-statement", path = "src/bin/storage-statement.rs", test = false },
]

[package]
name = "fuzz-targets"
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false

[dependencies]
boot-firmware = { path = "../../../core/boot/firmware" }
boot-protocol = { path = "../../../abi/boot-protocol" }
devmgr-firmware = { path = "../../../services/devmgr/firmware" }
driver-binding = { path = "../../../shared/driver-binding" }
elf = { path = "../../../shared/elf" }
firmware-tables = { path = "../../../shared/firmware-tables" }
fuzz-engine = { path = "../engine" }
hwrng-protocol = { path = "../../../shared/hwrng-protocol" }
init-protocol = { path = "../../../abi/init-protocol" }
objsig = { path = "../../../shared/objsig" }
storage-statement = { path = "../../../shared/storage-statement" }
vfsd-gpt = { path = "../../../services/vfsd/gpt" }

[lints]
workspace = true
